<section class="screen" id="intake5">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl"><span class="ttl__text">ซักประวัติ</span></span><div class="grow"><div class="progress"><span style="width:71%"></span></div></div></div>
    <div class="screen__body stack-5">
      <div class="stack-2" data-question-id="hair.photos" data-string-id="intake.hair.photos.title"><h2 class="h1">กรุณาเพิ่มรูปบริเวณรอบศีรษะทั้ง 4 มุม</h2></div>
      <p class="intake-privacy-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.7 8.2 7 10 4.3-1.8 7-5.4 7-10V6Z"/><path d="m9 12 2 2 4-4"/></svg><span>Your photos are private. Only your assigned doctor can view them.</span></p>

      <div class="stack-2">
        <div class="section-label">ตัวอย่าง</div>
        <ol class="photo-guide">
          <li class="photo-guide__item">
            <span class="photo-guide__figure">
              <img class="photo-guide__img" src="assets/intake/illustrated-v1/hair-angle-front-mascot-v2-linework-v1.png?v=20260920-float-v1" alt="ภาพวาดตัวอย่างแนวไรผมจากด้านหน้า โดยเปิดหน้าผากและขมับให้เห็นชัด" loading="lazy" onerror="this.closest('.photo-guide__figure').classList.add('is-empty')">
            </span>
            <span class="photo-guide__label">แนวไรผมด้านหน้า</span>
          </li>
          <li class="photo-guide__item">
            <span class="photo-guide__figure">
              <img class="photo-guide__img" src="assets/intake/illustrated-v1/hair-angle-crown-mascot-v3-linework-v1.png?v=20260920-float-v1" alt="ภาพวาดตัวอย่างกลางศีรษะจากด้านบน โดยก้มหน้าให้เห็นหนังศีรษะชัด" loading="lazy" onerror="this.closest('.photo-guide__figure').classList.add('is-empty')">
            </span>
            <span class="photo-guide__label">กลางศีรษะ</span>
          </li>
          <li class="photo-guide__item">
            <span class="photo-guide__figure">
              <img class="photo-guide__img" src="assets/intake/illustrated-v1/hair-angle-back-mascot-v2-linework-v1.png?v=20260920-float-v1" alt="ภาพวาดตัวอย่างขม่อมและด้านหลังศีรษะจากมุมสูงเล็กน้อย" loading="lazy" onerror="this.closest('.photo-guide__figure').classList.add('is-empty')">
            </span>
            <span class="photo-guide__label">ขม่อมด้านหลัง</span>
          </li>
          <li class="photo-guide__item">
            <span class="photo-guide__figure">
              <img class="photo-guide__img" src="assets/intake/illustrated-v1/hair-angle-side-mascot-v3-linework-v1.png" width="800" height="800" alt="ภาพวาดตัวอย่างด้านข้าง โดยเปิดเส้นผมให้เห็นแนวขมับและใบหูชัด" loading="lazy" decoding="async" onerror="this.closest('.photo-guide__figure').classList.add('is-empty')">
            </span>
            <span class="photo-guide__label">ด้านข้างและขมับ</span>
          </li>
        </ol>
      </div>

      <label class="upload" for="rx-photo-input">
        <span class="up-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/><path d="M12 15V4M8 8l4-4 4 4"/></svg></span>
        <span class="up-title">ถ่ายรูปหรืออัปโหลด</span>
        <span class="up-sub">JPG หรือ PNG · ไม่เกิน 10 MB ต่อรูป</span>
      </label>
      <input id="rx-photo-input" class="sr-only" type="file" accept="image/*" multiple data-photo-input>
      <div class="up-thumbs" data-photo-thumbs></div>
    </div>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-direct-intake-complete>Continue</button><button class="btn btn--ghost" data-direct-intake-complete>Skip</button></div>
  </section>
