<section class="screen" id="intake1" data-screen-code="SCR-DIR-02">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl"><span class="ttl__text">ซักประวัติ</span></span><div class="grow"><div class="progress"><span style="width:14%"></span></div></div></div>
    <div class="screen__body stack-5">
      <div><h2 class="h1">What are you noticing right now?</h2></div>
      <div class="stack-3">
        <button class="option" aria-selected="true" data-multi data-hair-symptom><span class="opt-body"><span class="opt-title">Hair thinning or shedding</span><span class="opt-sub">Crown, temples, hairline or overall density</span></span><span class="opt-check"></span></button>
        <button class="option" data-multi><span class="opt-body"><span class="opt-title">Scalp irritation, redness or itching</span></span><span class="opt-check"></span></button>
        <button class="option" data-multi><span class="opt-body"><span class="opt-title">Skin change, rash or acne</span></span><span class="opt-check"></span></button>
        <button class="option" data-multi><span class="opt-body"><span class="opt-title">Sleep, stress or energy concern</span></span><span class="opt-check"></span></button>
        <button class="option" data-multi data-general-symptom><span class="opt-body"><span class="opt-title">Something else</span><span class="opt-sub">Use General consultation if none of these fits</span></span><span class="opt-check"></span></button>
      </div>
      <div class="field intake-duration-field">
        <label for="intake-duration">How long has this been happening?</label>
        <div class="partner-duration-row intake-duration-control">
          <div class="partner-duration-stepper">
            <button type="button" data-intake-duration-step="-1" aria-label="Decrease duration">−</button>
            <input id="intake-duration" data-intake-role="duration" type="number" inputmode="numeric" min="1" max="99" value="1" required>
            <button type="button" data-intake-duration-step="1" aria-label="Increase duration">+</button>
          </div>
          <div class="partner-duration-units">
            <button type="button" aria-selected="true" data-intake-duration-unit="day">Day</button>
            <button type="button" aria-selected="false" data-intake-duration-unit="week">Week</button>
            <button type="button" aria-selected="false" data-intake-duration-unit="month">Month</button>
            <button type="button" aria-selected="false" data-intake-duration-unit="year">Year</button>
          </div>
        </div>
      </div>
    </div>
    <div class="screen__footer"><button class="btn btn--primary" data-go="intake2" data-flag-go="ineligible">Continue</button></div>
  </section>
