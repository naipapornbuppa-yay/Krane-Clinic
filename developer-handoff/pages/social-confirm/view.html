<section class="screen form-flow" id="social-confirm">
    <div class="screen__top form-flow__top"><button class="back" data-back>‹</button><span class="ttl">Confirm your account</span></div>
    <div class="screen__body stack-4 form-flow__body">
      <div class="stack-2 form-flow__intro"><h2 class="h1">You’re signed in</h2></div>
      <div class="auth-identity">
        <span class="auth-provider" data-auth-provider-icon><svg class="brand-icon" aria-hidden="true"><use href="#logo-line"></use></svg></span>
        <div class="grow"><strong data-auth-display-name>บัญชีของคุณ</strong><div class="hint" data-auth-email></div></div>
        <span class="badge badge--ok">Verified</span>
      </div>
      <div class="auth-name-grid">
        <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="social-first-name" autocomplete="given-name" placeholder=" "><label for="social-first-name">First name</label></span></div></div>
        <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="social-last-name" autocomplete="family-name" placeholder=" "><label for="social-last-name">Last name</label></span></div></div>
      </div>
      <div class="auth-name-grid"><div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="social-birth-date" type="date" autocomplete="bday" required><label for="social-birth-date">Date of birth</label></span></div></div><div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="social-phone" type="tel" autocomplete="tel" placeholder=" "><label for="social-phone">Phone number</label></span></div></div></div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="social-email" type="email" autocomplete="email" data-auth-email-input placeholder=" "><label for="social-email">Email</label></span></div></div>
      <label class="auth-check"><span class="check"><input type="checkbox" checked><span class="box"></span></span><span class="hint">I confirm these details are mine and may be used for appointment updates, prescriptions and delivery.</span></label>
    </div>
    <div class="screen__footer stack-2 form-flow__footer"><button class="btn btn--primary" data-auth-continue>Confirm &amp; continue</button><button class="btn btn--ghost" data-back>Use another account</button></div>
  </section>
