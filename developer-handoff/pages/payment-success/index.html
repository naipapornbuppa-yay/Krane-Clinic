<section class="screen postpay-screen" id="payment-success" data-screen-code="SCR-016D">
    <div class="screen__top postpay-brandbar"><img class="checkout-brandbar__logo" src="../assets/brand-final/krane-lockup-blue.svg" width="473" height="72" alt="Krane Clinic"></div>
    <!-- Client, 24 Sep: this screen says one thing — the money went through —
         and hands over to tracking. The order number, the amount, the payment
         method, the arrival window and a three-step progress bar were all
         repeated on the tracking screen one tap away, so the patient read the
         same order twice. It is the outcome illustration the rest of the app
         uses for this state, the sentence, and the button. -->
    <div class="screen__body state-view center">
      <div class="state-view__visual" role="img" aria-label="ชำระเงินเรียบร้อยแล้ว">
        <span class="state-view__tile state-view__tile--brand"><svg class="krane-state-art" viewBox="0 0 560 360" aria-hidden="true"><use href="#krane-state-payment-success"></use></svg></span>
        <span class="state-view__badge"><i data-lucide="check" class="ui-icon" aria-hidden="true"></i></span>
      </div>
      <div class="state-view__copy">
        <h2 class="h1" data-payment-success-title>ชำระเงินเรียบร้อยแล้ว</h2>
        <p class="muted" data-payment-success-copy>ร้านขายยาได้รับคำสั่งซื้อและกำลังเตรียมยาให้คุณ</p>
      </div>
    </div>
    <div class="screen__footer postpay-success__actions">
      <button class="btn btn--primary" data-payment-success-cta data-go="tracking">ติดตามคำสั่งซื้อ</button>
      <button class="btn btn--ghost" type="button" data-doc-open="receipt">ดูใบเสร็จ</button>
    </div>
  </section>
