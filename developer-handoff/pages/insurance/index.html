<section class="screen" id="insurance">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">Insurance check</span></div>
    <div class="screen__body stack-4">
      <div class="stack-2" data-insurance-setup-title hidden>
        <h2 class="h1">ยืนยันข้อมูลเพื่อเช็กสิทธิ์</h2>
        <p class="muted">ตรวจสอบข้อมูลผู้ถือสิทธิ์ก่อนเลือกแผนประกันที่ใช้ได้</p>
      </div>
      <div class="stack-2">
        <div class="partner-binary partner-binary--accent" role="tablist" aria-label="ประเภทเอกสาร"><button class="partner-binary__option" type="button" role="tab" data-toggle data-insurance-doc="id" aria-selected="true">บัตรประชาชน</button><button class="partner-binary__option" type="button" role="tab" data-toggle data-insurance-doc="passport" aria-selected="false">หนังสือเดินทาง</button></div>
      </div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="insurance-id" inputmode="numeric" maxlength="17" autocomplete="off" data-national-id placeholder="0-0000-00000-00-0"><label for="insurance-id">เลขบัตรประชาชน</label></span></div></div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="insurance-dob" type="date" autocomplete="bday" required><label for="insurance-dob">วันเกิด</label></span></div></div>
      <div class="card card--pad-sm stack-2" data-insurance-order>
        <div class="between"><span class="muted">Order total</span><span class="amt">฿ 558</span></div>
        <div class="between"><span class="muted">Use insurance credit</span><span class="amt">฿ 558</span></div>
        <div class="between"><span class="muted">You pay (overage)</span><strong>฿ 0</strong></div>
        <div class="hint">Choose how much insurance credit to use.</div>
      </div>
      <p class="hint" data-insurance-profile-hint hidden>ระบบจะตรวจสอบสิทธิ์ของคุณก่อนดำเนินการต่อ</p>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-insurance-confirm data-string-id="action.check_eligibility">ตรวจสอบสิทธิ์</button><button class="btn btn--ghost" data-go="payment" data-insurance-order-action>ชำระเงินเอง</button></div>
  </section>
