<section class="screen" id="account">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">Personal details</span></div>
    <div class="screen__body stack-4">
      <div class="auth-name-grid"><div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-first-name" autocomplete="given-name" value="มะลิ" required placeholder=" "><label for="account-first-name">ชื่อจริง</label></span></div></div><div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-last-name" autocomplete="family-name" value="สุธิดา" required placeholder=" "><label for="account-last-name">นามสกุล</label></span></div></div></div>
      <div class="partner-binary partner-binary--accent" role="tablist" aria-label="ประเภทเอกสาร"><button class="partner-binary__option" type="button" role="tab" data-toggle data-account-doc="id" aria-selected="true">บัตรประชาชน</button><button class="partner-binary__option" type="button" role="tab" data-toggle data-account-doc="passport" aria-selected="false">หนังสือเดินทาง</button></div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-document" inputmode="numeric" maxlength="17" autocomplete="off" data-national-id placeholder="0-0000-00000-00-0"><label for="account-document">เลขบัตรประชาชน</label></span></div></div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-phone" type="tel" autocomplete="tel" value="+66 89 123 4567" required placeholder=" "><label for="account-phone">Phone</label></span></div></div>
      <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-email" type="email" autocomplete="email" value="mali.s@example.com" required placeholder=" "><label for="account-email">Email</label></span></div></div>
      <div class="field"><div class="row" style="gap:var(--sp-2)"><div class="field grow float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="account-card" value="Visa ···· 4242" required placeholder=" "><label for="account-card">Card on file</label></span></div></div><button class="btn btn--secondary btn--sm" data-demo-action="เปิดการเปลี่ยนวิธีชำระเงินแล้ว">Replace</button></div><div class="hint" style="margin-top:6px">Card details are stored securely by the payment provider.</div></div>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-go="settings">Save changes</button><button class="btn btn--ghost" data-go="settings">Cancel</button></div>
  </section>
