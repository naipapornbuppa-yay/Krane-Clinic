<section class="screen auth-screen auth-screen--signup" id="signup">
    <div class="screen__top checkout-brandbar auth-screen__top"><button class="back" data-back aria-label="ย้อนกลับ">‹</button><img class="checkout-brandbar__logo auth-screen__logo" src="../assets/brand-final/krane-lockup-blue.svg" width="473" height="72" alt="Krane Clinic"></div>
    <div class="screen__body auth-screen__body">
      <div class="auth-screen__panel">
        <div class="auth-screen__intro">
          <h2 class="h1">Create Account</h2>
        </div>
        <div class="auth-screen__form">
          <!-- Floating label (P'New, 19 Sep; hims.com and Xiaomi references): the label sits in the
               box like a placeholder and rises to a small title when the field is used. -->
          <div class="field auth-login-field float-field"><div class="phone-field" data-phone-field><span class="float-field__slot"><input class="input phone-field__input" id="signup-phone" type="tel" inputmode="tel" maxlength="12" autocomplete="tel" placeholder=" "><label for="signup-phone">Phone number</label></span></div></div>
          <!-- Client, 19 Sep (Xiaomi reference): the password is set on this page, under
               the phone number, so sign-up is one form and OTP is the last step. -->
          <div class="field auth-login-field float-field">
            <div class="password-field"><span class="float-field__slot"><input class="input" id="signup-password" type="password" autocomplete="new-password" placeholder=" "><label for="signup-password">รหัสผ่าน</label></span><button class="password-field__toggle" type="button" data-password-toggle="signup-password" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye"></i></button></div>
          </div>
          <div class="field auth-login-field float-field">
            <div class="password-field"><span class="float-field__slot"><input class="input" id="signup-confirm" type="password" autocomplete="new-password" placeholder=" "><label for="signup-confirm">ยืนยันรหัสผ่าน</label></span><button class="password-field__toggle" type="button" data-password-toggle="signup-confirm" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye"></i></button></div>
            <p class="hint password-mismatch" data-signup-password-match hidden>รหัสผ่านทั้งสองช่องยังไม่ตรงกัน</p>
          </div>
          <!-- Client, 21 Sep: "there is so many info in one page" — the checklist
               stays out of the way until someone is actually typing a password
               that does not pass yet, and folds away again once it does. -->
          <ul class="password-rules" data-signup-password-rules hidden>
            <li data-signup-password-rule="length"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>อย่างน้อย 8 ตัวอักษร</span></li>
            <li data-signup-password-rule="letter"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีตัวอักษรภาษาอังกฤษ</span></li>
            <li data-signup-password-rule="number"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีตัวเลข</span></li>
            <li data-signup-password-rule="symbol"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีอักขระพิเศษ เช่น ! @ # ?</span></li>
          </ul>
          <button class="btn btn--primary" data-signup-phone>Create Account</button>
        </div>
        <p class="auth-screen__new"><span>Already have an account?</span> <button class="textlink auth-screen__create" data-go="login">Log In</button></p>
        <div class="auth-screen__separator"><span>Or other sign-up options</span></div>
        <div class="stack-2 auth-screen__social">
        <button class="btn btn--secondary social-btn" data-social="LINE" data-auth-next="consent-terms"><svg class="brand-icon" aria-hidden="true"><use href="#logo-line"></use></svg><span>Sign up with LINE</span></button>
        <button class="btn btn--secondary social-btn" data-social="Google" data-auth-next="consent-terms"><svg class="brand-icon" aria-hidden="true"><use href="#logo-google"></use></svg><span>Sign up with Google</span></button>
        </div>
      </div>
    </div>
  </section>
