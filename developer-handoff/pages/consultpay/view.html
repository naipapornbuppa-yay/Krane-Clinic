<section class="screen" id="consultpay" data-screen-code="SCR-008" data-checkout-mode="consultation">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">Pay consultation fee</span></div>
    <div class="screen__body stack-4">
      <!-- Restored from the approved 5 Aug SCR-008: one card, with no separate
           fee banner and no second detail card repeating the same information. -->
      <div class="card card--pad-sm stack-3">
        <div class="between">
          <span class="muted">แพทย์ที่รับเคส</span>
          <span class="doctor-value">
            <img class="consult-doctor-photo" src="assets/consultation/doctor-video-live.jpg?v=20260920-float-v1" alt="" width="40" height="40">
            <strong>แพทย์<span data-doctor-name>นรินทร์</span></strong>
          </span>
        </div>
        <div class="between"><span class="muted">เลขใบประกอบวิชาชีพ</span><strong>ว.42317</strong></div>
        <div class="between consultpay-appointment-row" data-consult-appointment-row hidden><span class="muted">วันและเวลานัด</span><time data-consult-appointment-datetime></time></div>
        <!-- Client, 22 Sep: the rule was sitting on the row above it — zero space
             over, twelve under. Equal on both sides now. -->
        <div class="divider" style="margin:12px 0 0"></div>
        <div class="between"><span class="muted">Doctor consultation</span><span class="consult-fee"><s class="consult-fee__was" data-consult-list-amount hidden>฿ 350</s><strong data-consult-base-amount>฿ 350</strong></span></div>
        <div class="between" data-consult-coverage-row hidden><span class="muted">สิทธิ์ประกัน</span><strong data-consult-coverage-amount>- ฿ 0</strong></div>
        <div class="between" data-consult-payment-control><span class="muted">Discount</span><strong>- ฿ 0</strong></div>
        <!-- Client, 28 Aug: this row repeated the ฿350 directly above it and read
             as a second charge. When the fee is settled with the medicine, that
             is a fact about timing, not another line on a bill — it is said once,
             in a toast, and the footer hint carries it on the page. -->
        <div class="between"><span class="muted">ใช้เวลาปรึกษา</span><strong>ประมาณ 15 นาที</strong></div>
        <div class="between"><span class="muted">ส่งยารอบสุดท้าย</span><strong>21:00 น.</strong></div>
        <p class="hint consultpay-cutoff-note">หากปรึกษาหลัง 21:00 น. อาจจะได้รับยาในวันถัดไป</p>
      </div>
      <!-- Client (5 Jul): the medical certificate is requested HERE, paid with the doctor fee -->
      <label class="card card--pad-sm row" data-consult-payment-control style="cursor:pointer;align-items:flex-start"><span class="check" style="margin-top:2px"><input type="checkbox" data-cert-check><span class="box"></span></span><div class="grow"><strong>ขอใบรับรองแพทย์ · ฟรี</strong><div class="hint">Issued by your doctor after the consultation. A signed PDF appears in your documents.</div></div></label>
      <div class="field" data-consult-payment-control><div class="row" style="gap:var(--sp-2)"><div class="field grow float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="consult-discount-code" placeholder=" "><label for="consult-discount-code">Discount code (optional)</label></span></div></div><button class="btn btn--secondary btn--sm" data-demo-action="ตรวจสอบโค้ดแล้ว">Apply</button></div></div>
      <div class="stack-2" data-consult-payment-control>
        <div class="eyebrow">Pay with</div>
        <button class="option" aria-selected="true" data-select><span class="opt-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2"/><path d="M14 14h2.5v2.5M20.5 14v.01M14 20.5v.01M17.2 20.5v.01M20.5 17.2v3.3"/></svg></span><span class="opt-title">QR / PromptPay</span><span class="opt-check"></span></button>
        <button class="option" data-select><span class="opt-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9.5h18M6.5 14.5h4"/></svg></span><span class="opt-title">Credit / debit card</span><span class="opt-check"></span></button>
      </div>
<div class="screen__footer stack-2"><!-- Client, 22 Sep: said the same way every other notice in the app is said —
       icon, title, detail, read from the left — instead of a centred tinted
       paragraph of its own. -->
    <div class="alert alert--info consultpay-fee-note" role="note"><span class="a-ic" aria-hidden="true">i</span><div class="a-title">นี่คือค่าปรึกษาแพทย์เท่านั้น</div></div><button class="btn btn--primary" data-consultpay-go data-string-id="action.pay"><span data-consultpay-label>ชำระเงิน</span> <span data-pay-btn-amt hidden>฿ 350</span></button></div>
  </section>
