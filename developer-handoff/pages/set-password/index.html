<section class="screen auth-screen" id="set-password">
    <div class="screen__top auth-screen__top"><button class="back" data-back>‹</button><span class="ttl" data-password-heading>ตั้งรหัสผ่าน</span></div>
    <div class="screen__body auth-screen__body">
      <div class="auth-screen__panel">
        <div class="auth-screen__intro">
          <h2 class="h1" data-password-title>ตั้งรหัสผ่าน</h2>
          <p class="muted" data-password-lead>ยืนยันเบอร์เรียบร้อยแล้ว ตั้งรหัสผ่านไว้เข้าสู่ระบบครั้งต่อไปได้เลย</p>
        </div>
        <div class="auth-screen__form stack-3">
          <div class="field auth-login-field float-field">
            <div class="password-field"><span class="float-field__slot"><input class="input" id="new-password" type="password" autocomplete="new-password" placeholder=" "><label for="new-password">รหัสผ่าน</label></span><button class="password-field__toggle" type="button" data-password-toggle="new-password" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye"></i></button></div>
          </div>
          <div class="field auth-login-field float-field">
            <div class="password-field"><span class="float-field__slot"><input class="input" id="confirm-password" type="password" autocomplete="new-password" placeholder=" "><label for="confirm-password">ยืนยันรหัสผ่าน</label></span><button class="password-field__toggle" type="button" data-password-toggle="confirm-password" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye"></i></button></div>
            <p class="hint password-mismatch" data-password-match hidden>รหัสผ่านทั้งสองช่องยังไม่ตรงกัน</p>
          </div>
          <!-- The checklist reads as the summary of both fields, so it sits
               under the pair rather than between them (client, 13 Sep). -->
          <ul class="password-rules" data-password-rules>
            <li data-password-rule="length"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>อย่างน้อย 8 ตัวอักษร</span></li>
            <li data-password-rule="letter"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีตัวอักษรภาษาอังกฤษ</span></li>
            <li data-password-rule="number"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีตัวเลข</span></li>
            <li data-password-rule="symbol"><i data-lucide="circle" class="password-rule__todo" aria-hidden="true"></i><i data-lucide="circle-check" class="password-rule__done" aria-hidden="true"></i><span>มีอักขระพิเศษ เช่น ! @ # ?</span></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-password-save disabled>บันทึกรหัสผ่านและไปต่อ</button></div>
  </section>
