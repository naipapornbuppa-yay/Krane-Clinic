<section class="screen" id="otp">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">Verify your code</span></div>
    <div class="screen__body stack-4">
      <div class="stack-2"><h2 class="h1">Enter the code</h2></div>
      <div class="otp-entry" data-otp-entry>
        <label class="sr-only" for="otp-code">รหัส OTP 6 หลัก</label>
        <input class="otp-entry__input" id="otp-code" data-otp-code inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" aria-label="รหัส OTP 6 หลัก">
        <div class="otp-entry__cells" aria-hidden="true">
          <span class="otp-entry__cell is-current" data-otp-cell></span>
          <span class="otp-entry__cell" data-otp-cell></span>
          <span class="otp-entry__cell" data-otp-cell></span>
          <span class="otp-entry__cell" data-otp-cell></span>
          <span class="otp-entry__cell" data-otp-cell></span>
          <span class="otp-entry__cell" data-otp-cell></span>
        </div>
      </div>
      <p class="hint center">Didn't get it? <a data-demo-action="ส่งรหัส OTP ใหม่แล้ว" style="color:var(--color-blue);text-decoration:underline;cursor:pointer">Resend code</a> · sent via SMS</p>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-auth-complete disabled>ยืนยันรหัสและไปต่อ</button></div>
  </section>
