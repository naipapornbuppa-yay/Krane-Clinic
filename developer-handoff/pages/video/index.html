<section class="screen" id="video">
    <div class="screen__top video-call-top checkout-brandbar"><img class="checkout-brandbar__logo" src="../assets/brand-final/krane-lockup-blue.svg" width="473" height="72" alt="Krane Clinic"><button class="transition-stage__close" data-endcall data-go="consult" aria-label="วางสาย">×</button></div>
    <div class="screen__body callstage callstage--live">
      <div class="call-self call-self--camera call-self--photo" data-call-self style="overflow:hidden;padding:0;place-items:stretch;background:#dceef8">
        <img class="call-self__image" src="assets/call-self-patient-v1.png" width="512" height="640" alt="ภาพของคุณระหว่างการปรึกษา" style="width:100%;height:100%;display:block;object-fit:cover;object-position:center 24%">
      </div>
      <!-- Chat sits on a floating button, not in the control row: that row is for
           call hardware (mic / camera / hang up), so burying chat there made it
           read as another toggle. LINE-style, opening chat keeps the call live
           and the chat screen shows the "Return to call" bar. -->
      <button class="call-fab" data-go="consult" aria-label="เปิดแชท" title="เปิดแชท การโทรยังดำเนินต่อ">
        <i data-lucide="message-circle" class="ui-icon ui-icon--sm" aria-hidden="true"></i>
        <span class="sr-only">แชท</span>
        <span class="call-fab__badge" data-consult-unread-badge hidden aria-hidden="true">1</span>
      </button>
      <div class="call-remote call-remote--video">
        <img class="call-remote__video" src="assets/consultation/doctor-video-live.jpg?v=20260920-float-v1" alt="แพทย์นรินทร์พร้อมพูดคุยผ่านวิดีโอคอล">
        <div class="call-remote__identity">
          <div class="call-name">Dr. Narin</div>
          <div class="call-status" data-call-status>Video consultation · 02:14</div>
          <div class="call-note" data-camera-note hidden>Camera off. The consultation continues on voice and chat.</div>
        </div>
      </div>
      <div class="call-controls">
        <button class="call-btn" data-press data-call-icon="mic" data-call-icon-pressed="mic-off" aria-pressed="false" title="Mute"><span class="lbl">Mute</span></button>
        <!-- Camera toggles voice-only in place; no separate screen for it. -->
        <button class="call-btn" data-press data-camera-toggle data-call-icon="video" data-call-icon-pressed="video-off" aria-pressed="false" title="Turn camera off"><span class="lbl" data-camera-lbl>Cam off</span></button>
        <button class="call-btn call-btn--end" data-endcall data-go="consult" data-call-icon="phone-off" title="End call"><span class="lbl">End</span></button>
      </div>
      <p class="call-hint" data-call-hint>Turning your camera off keeps the call on voice. End hangs up.</p>
    </div>
  </section>
