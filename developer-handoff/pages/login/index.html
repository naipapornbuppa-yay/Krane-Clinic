<section class="screen auth-screen auth-screen--login" id="login">
    <div class="screen__top checkout-brandbar auth-screen__top"><button class="back" data-back aria-label="ย้อนกลับ">‹</button><img class="checkout-brandbar__logo auth-screen__logo" src="../assets/brand-final/krane-lockup-blue.svg" width="473" height="72" alt="Krane Clinic"></div>
    <div class="screen__body auth-screen__body">
      <div class="auth-screen__panel">
        <div class="alert auth-screen__context" data-login-intake-notice role="status" hidden>
          <span class="a-ic" aria-hidden="true">i</span>
          <div><div class="a-title">Log in to continue your treatment</div><div class="hint">Your assessment is saved. Sign in to continue where you left off.</div></div>
        </div>
        <div class="auth-screen__intro"><h2 class="h1">Welcome back</h2></div>
        <div class="auth-screen__form">
          <!-- Floating label (P'New, 19 Sep; hims.com and Xiaomi references): the label sits in the
               box like a placeholder and rises to a small title when the field is used. -->
          <div class="field auth-login-field float-field"><div class="phone-field" data-phone-field><span class="float-field__slot"><input class="input phone-field__input" id="login-phone" type="tel" inputmode="tel" maxlength="12" autocomplete="tel" placeholder=" "><label for="login-phone">Phone number</label></span></div></div>
          <div class="field auth-login-field float-field"><div class="password-field"><span class="float-field__slot"><input class="input" id="login-password" type="password" autocomplete="current-password" placeholder=" "><label for="login-password">Password</label></span><button class="password-field__toggle" type="button" data-password-toggle="login-password" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye"></i></button></div></div>
          <button class="textlink auth-screen__forgot" type="button" data-login-forgot>Forgot your password?</button>
          <button class="btn btn--primary auth-screen__submit" data-login-submit>Log In</button>
        </div>
        <p class="auth-screen__new"><span>First time here?</span> <button class="textlink auth-screen__create" data-new-account>Create Account</button></p>
        <div class="auth-screen__separator"><span>or</span></div>
        <div class="stack-2 auth-screen__social">
          <button class="btn btn--secondary social-btn" data-social="LINE"><svg class="brand-icon" aria-hidden="true"><use href="#logo-line"></use></svg><span>Continue with LINE</span></button>
          <button class="btn btn--secondary social-btn" data-social="Google"><svg class="brand-icon" aria-hidden="true"><use href="#logo-google"></use></svg><span>Continue with Google</span></button>
        </div>
      </div>
    </div>
  </section>
