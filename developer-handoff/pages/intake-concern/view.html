<section class="screen" id="intake-concern">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl"><span class="ttl__text">ซักประวัติ</span></span><div class="grow"><div class="progress"><span style="width:86%"></span></div></div></div>
    <div class="screen__body partner-health-compact shared-health-intake">
      <div class="stack-2"><h2 class="h1">อาการที่ต้องการปรึกษา</h2><p class="muted">กรอกรายละเอียดอาการ ระยะเวลา และสิ่งที่ลองทำแล้ว เพื่อช่วยให้แพทย์ประเมินได้แม่นยำขึ้น</p></div>
      <div class="card card--pad-sm shared-concern-card" data-shared-concern>
        <div class="shared-concern-grid">
          <div class="field float-field"><div class="float-field__box"><span class="float-field__slot"><textarea class="textarea partner-concern-textarea" id="partner-concern-text" placeholder="เช่น ผื่นคันที่แขน บวม แดง หรือมีอาการปวด"></textarea><label for="partner-concern-text">อาการเป็นอย่างไรบ้าง?</label></span></div></div>
          <div class="field">
            <label for="partner-concern-duration-value">เป็นมานานแค่ไหนแล้ว?</label>
            <div class="partner-duration-row">
              <div class="partner-duration-stepper">
                <button type="button" data-partner-duration-step="-1" aria-label="ลดระยะเวลา">−</button>
                <input id="partner-concern-duration-value" type="number" inputmode="numeric" min="1" max="99" value="1" aria-label="จำนวนระยะเวลา">
                <button type="button" data-partner-duration-step="1" aria-label="เพิ่มระยะเวลา">+</button>
              </div>
              <div class="partner-duration-units" aria-label="หน่วยระยะเวลา">
                <button type="button" aria-selected="true" data-partner-duration-unit="วัน">วัน</button>
                <button type="button" aria-selected="false" data-partner-duration-unit="สัปดาห์">สัปดาห์</button>
                <button type="button" aria-selected="false" data-partner-duration-unit="เดือน">เดือน</button>
                <button type="button" aria-selected="false" data-partner-duration-unit="ปี">ปี</button>
              </div>
            </div>
          </div>
          <div class="field shared-concern-grid__wide">
            <span class="field-label">ทำอะไรเพื่อบรรเทาอาการไปแล้วบ้าง?</span>
            <div class="partner-relief-grid" aria-label="สิ่งที่ลองทำแล้ว">
              <button type="button" aria-selected="false" data-partner-relief-value="ยังไม่ได้ทำ">ยังไม่ได้ทำ</button>
              <button type="button" aria-selected="false" data-partner-relief-value="ทานหรือใช้ยา">ทานหรือใช้ยา</button>
              <button type="button" aria-selected="false" data-partner-relief-value="พบแพทย์">พบแพทย์</button>
              <button type="button" aria-selected="false" data-partner-relief-value="อื่น ๆ">อื่น ๆ</button>
            </div>
          </div>
          <div class="field shared-concern-grid__wide">
            <span class="field-label">มีรูปประกอบอาการหรือยาหรือไม่? <span class="hint">(ถ้ามี)</span></span>
            <label class="upload partner-photo-upload" for="partner-photo-input">
              <span class="up-ic"><span data-demo-icon="camera"></span></span>
              <span class="up-title">ถ่ายรูปหรืออัปโหลด</span>
              <span class="up-sub">สูงสุด 5 รูป · 10 MB ต่อรูป</span>
            </label>
          </div>
          <input id="partner-photo-input" class="sr-only" type="file" accept="image/*" multiple data-partner-photo-input>
          <div class="up-thumbs shared-concern-grid__wide" data-partner-photo-thumbs aria-live="polite"></div>
        </div>
        <p class="intake-privacy-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.7 8.2 7 10 4.3-1.8 7-5.4 7-10V6Z"/><path d="m9 12 2 2 4-4"/></svg><span>Your answers stay private and are used only for this consultation.</span></p>
      </div>
    </div>
    <div class="screen__footer"><button class="btn btn--primary" data-intake-complete>ถัดไป</button></div>
  </section>
