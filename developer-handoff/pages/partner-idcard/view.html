<section class="screen" id="partner-idcard" data-screen-code="SCR-002A">
    <div class="screen__top checkout-brandbar"><button class="back" data-back aria-label="ย้อนกลับ">‹</button><img class="checkout-brandbar__logo" src="../assets/brand-final/krane-lockup-blue.svg" width="473" height="72" alt="Krane Clinic"></div>
    <div class="screen__body stack-4">
      <div class="stack-2">
        <h2 class="h1">ถ่ายบัตรประชาชน</h2>
        <p class="muted">เราจะดึงชื่อจากบัตรมากรอกให้ในหน้าถัดไป ตรวจสอบและแก้ไขได้ก่อนยืนยัน</p>
      </div>
      <label class="upload" for="partner-idcard-input">
        <span class="up-ic"><i data-lucide="id-card" class="ui-icon" aria-hidden="true"></i></span>
        <span class="up-title">ถ่ายรูปหรืออัปโหลด</span>
        <span class="up-sub">JPG หรือ PNG · ไม่เกิน 10 MB</span>
      </label>
      <input id="partner-idcard-input" class="sr-only" type="file" accept="image/*" data-idcard-input>
      <div class="up-thumbs" data-idcard-thumbs aria-live="polite">
        <p class="up-empty hint" data-idcard-empty>ยังไม่มีรูปบัตร แตะด้านบนเพื่อถ่ายหรือเลือกรูป</p>
      </div>
      <div class="card card--pad-sm stack-2" data-idcard-read hidden>
        <div class="section-label">ข้อมูลที่อ่านจากบัตร</div>
        <div class="between"><span class="muted">ชื่อและนามสกุล</span><strong data-idcard-name></strong></div>
        <p class="hint">แก้ไขได้ในหน้าถัดไป</p>
      </div>
    </div>
    <div class="screen__footer stack-2">
      <button class="btn btn--primary" data-idcard-continue>ยืนยันและไปต่อ</button>
      <button class="btn btn--ghost btn--sm" data-idcard-skip>กรอกข้อมูลเอง</button>
    </div>
  </section>
