<section class="screen" id="matching" data-screen-code="SCR-006">
    <div class="screen__top transition-stage__top"><span class="ttl">Doctor match</span><button class="transition-stage__close" data-back aria-label="Close">×</button></div>
    <div class="screen__body state-view center">
      <div class="state-view__visual state-view__visual--loading" role="status" aria-label="Finding your doctor">
        <!-- The matching state returns to the patient-and-doctor illustration.
             The seated pose is neutral with uncrossed legs and indoor slippers. -->
        <span class="state-view__tile state-view__tile--cutout loading-illustration" aria-hidden="true"><svg class="krane-state-art" viewBox="0 0 560 360"><use href="#krane-state-doctor-matching"></use></svg></span>
        <span class="state-view__badge"><i data-lucide="stethoscope" class="ui-icon" aria-hidden="true"></i></span>
      </div>
      <div class="state-view__copy">
        <!-- Client, 1 Sep. This said "ซักประวัติเรียบร้อยแล้ว" — it named the
             step that had just finished, on a screen whose whole job is to say
             what is happening now while the patient waits. -->
        <h2 class="h1">กำลังหาแพทย์ให้คุณ</h2>
        <p class="muted" data-matching-copy>เลือกจากแพทย์ที่มีใบอนุญาตและพร้อมให้คำปรึกษา</p>
      </div>
      <div class="state-view__timer" data-matching-countdown role="timer" aria-live="polite" aria-label="ผ่านไป 0 วินาที" data-matching-countdown-value>00:00</div>
    </div>
  </section>
