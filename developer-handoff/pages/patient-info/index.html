<section class="screen" id="patient-info">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">ข้อมูลผู้รับบริการ</span></div>
    <div class="screen__body stack-4">
      <div class="stack-2"><h2 class="h1">ยืนยันข้อมูลส่วนตัว</h2></div>
      <!-- Client, 22 Sep: no white box behind the fields, as on the address and
           general-health pages. -->
      <div class="stack-3">
        <div data-shared-identity-fields="patient"></div>
      </div>
      <div class="stack-3" data-patient-payment-choice>
        <div class="section-label">ชำระเงินด้วยวิธีไหน</div>
        <button class="option" data-select data-patient-payment-choice-value="insurance"><span class="opt-body"><span class="opt-title">ใช้สิทธิ์ประกันสุขภาพ</span></span><span class="opt-check"></span></button>
        <button class="option" aria-selected="true" data-select data-patient-payment-choice-value="self-pay"><span class="opt-body"><span class="opt-title">ไม่ใช้สิทธิ์ประกัน</span></span><span class="opt-check"></span></button>
      </div>
    </div>
    <div class="screen__footer"><button class="btn btn--primary" data-patient-info-continue>ยืนยันข้อมูลและไปต่อ</button></div>
  </section>
