<section class="screen" id="waitroom" data-screen-code="SCR-009">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">รอปรึกษาแพทย์</span><button class="queue-close" type="button" data-queue-close aria-label="ปิดและเก็บคิวไว้">×</button></div>
    <div class="screen__body state-view center">
      <div class="state-view__visual state-view__visual--loading" role="status" aria-label="Waiting for the doctor" data-wait-visual>
        <span class="state-view__watercolor" aria-hidden="true"></span>
        <span class="state-view__tile state-view__tile--cutout loading-illustration" aria-hidden="true"><svg class="krane-state-art" viewBox="0 0 560 360"><use href="#krane-state-waiting-room" data-wait-art></use></svg></span>
        <span class="state-view__badge"><i data-lucide="video" class="ui-icon" aria-hidden="true"></i></span>
      </div>
      <div class="state-view__copy">
        <h2 class="h1" data-wait-title>ถึงคิวแล้ว!</h2>
        <p class="muted" data-wait-copy>กดเข้าห้องได้เลย แพทย์<span data-doctor-name>นรินทร์</span> พร้อมเจอคุณแล้ว</p>
      </div>
      <button class="btn btn--primary waitroom-entry-cta" data-wait-enter data-go="video" hidden>
        <span data-wait-enter-label>รอเรียกเข้าห้อง…</span>
        <span class="waitroom-entry-cta__timer" data-wait-timer aria-live="polite"></span>
      </button>
      <div class="queue-wait-actions stack-2">
        <p class="queue-clock" data-queue-clock><strong class="state-view__timer" data-queue-elapsed>00:00</strong></p>
        <button class="btn btn--ghost" type="button" data-queue-book hidden>เลือกเวลานัดหมายแพทย์</button>
      </div>
    </div>
    <!-- The room opens in video. Chat is where the room falls back to, not where it starts.
         The camera/mic note used to be a two-line paragraph under the copy; it is
         a one-line info chip on the button now (client, 18 Aug) — it is a
         precondition for the tap, not a second paragraph to read. -->
    <div class="screen__footer stack-2">
      <p class="info-chip" data-wait-note><i data-lucide="info" class="ui-icon" aria-hidden="true"></i><span>เปิดกล้องและไมค์ก่อนเข้าห้อง หรือสลับเป็นแชทได้</span></p>
    </div>
  </section>
