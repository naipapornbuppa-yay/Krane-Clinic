<section class="screen" id="consent-terms" data-screen-code="SCR-001">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">ความยินยอม</span></div>
    <div class="screen__body stack-4" data-consent-page-scroll>
      <div class="stack-2 consent-page__intro"><p class="eyebrow">ความเป็นส่วนตัวและการรักษาความลับ</p><h2 class="h1">เพื่อความสบายใจในการใช้บริการ</h2></div>
      <div class="card card--pad-sm stack-4 consent-page__content">
        <div class="consent-doc" data-consent-scroll="all" tabindex="0" role="region" aria-label="รายละเอียดความยินยอม PDPA และการแพทย์ทางไกล"></div>
        <div class="divider"></div>
        <div class="stack-3 consent-choices">
          <div class="stack-2 consent-choice" data-consent-card="pdpa">
            <label class="consent-agree"><span class="check"><input type="checkbox" data-consent-checkbox data-consent-type="pdpa" data-consent-required="true" disabled><span class="box"></span></span><span class="consent-choice__body"><span class="hint grow">ยินยอมให้ Krane ใช้ข้อมูลตามวัตถุประสงค์ในการให้บริการและดูแลสุขภาพ</span></span></label>
            <div class="hint consent-note" data-consent-read-state="pdpa" role="status">กรุณาอ่านเพื่อให้ความยินยอม</div>
          </div>
          <div class="stack-2 consent-choice" data-consent-card="telemedicine">
            <label class="consent-agree"><span class="check"><input type="checkbox" data-consent-checkbox data-consent-type="telemedicine" data-consent-required="true" disabled><span class="box"></span></span><span class="consent-choice__body"><span class="hint grow">รับทราบข้อจำกัดและยินยอมรับบริการจากแพทย์ผ่านระบบทางไกล</span></span></label>
            <div class="hint consent-note" data-consent-read-state="telemedicine" role="status">กรุณาอ่านเพื่อให้ความยินยอม</div>
          </div>
          <div class="stack-2 consent-choice consent-choice--optional" data-consent-card="marketing">
            <label class="consent-agree"><span class="check"><input type="checkbox" data-consent-checkbox data-consent-type="marketing" data-consent-required="false" disabled><span class="box"></span></span><span class="consent-choice__body"><span class="hint grow">ต้องการรับข่าวสารสุขภาพ ข่าวบริการ และข้อเสนอที่เกี่ยวข้องจาก Krane</span></span></label>
          </div>
        </div>
        <span class="consent-page__sentinel" data-consent-end aria-hidden="true"></span>
      </div>
    </div>
    <div class="screen__footer stack-2">
      <button class="consent-scroll-cue" type="button" data-consent-scroll-cue data-consent-auto-scroll aria-label="อ่านต่อจนจบ"><span class="sr-only">อ่านต่อจนจบ</span><i data-lucide="arrow-down" class="ui-icon" aria-hidden="true"></i></button>
      <button class="btn btn--primary" data-consent-continue disabled>ยอมรับและไปต่อ</button>
    </div>
  </section>
