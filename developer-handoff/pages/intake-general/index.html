<section class="screen" id="intake-general">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl"><span class="ttl__text" data-general-health-title>ซักประวัติ</span></span><div class="grow"><div class="progress"><span style="width:100%"></span></div></div></div>
    <div class="screen__body partner-health-compact shared-health-intake">
      <div class="stack-2"><h2 class="h1">ยืนยันข้อมูลสุขภาพ</h2><p class="hint" data-general-health-hint hidden>ตรวจสอบและอัปเดตข้อมูลนี้ก่อนพบแพทย์ทุกครั้ง เพื่อให้แพทย์เห็นข้อมูลล่าสุดของคุณ</p></div>
      <!-- Client, 22 Sep: no white container here. Every other questionnaire page
           puts its fields straight on the page; this was the only one in a card. -->
      <div class="partner-health-card">
        <div class="partner-health-grid">
          <div class="field grow float-field float-field--label-as-placeholder"><div class="float-field__box"><span class="float-field__slot"><select class="select" id="intake-sex"><option value=""></option><option value="male">ชาย</option><option value="female">หญิง</option></select><label for="intake-sex">เพศกำเนิด</label></span></div></div>
          <div class="field grow float-field float-field--date-placeholder-only"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="intake-dob" type="date" autocomplete="bday" aria-label="วันเกิด (อายุ)" required><label for="intake-dob">วันเกิด (อายุ)</label></span></div></div>
        </div>
        <div class="partner-health-grid">
          <div class="field grow float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="intake-height" inputmode="numeric" placeholder=" "><label for="intake-height">ส่วนสูง</label></span></div></div>
          <div class="field grow float-field"><div class="float-field__box"><span class="float-field__slot"><input class="input" id="intake-weight" inputmode="numeric" placeholder=" "><label for="intake-weight">น้ำหนัก</label></span></div></div>
        </div>
        <!-- Health-history selects share the same single-line floating prompt as
             birth sex: the field title is the empty state and rises after a choice. -->
        <div class="partner-health-grid partner-health-grid--lifestyle" data-shared-health-lifestyle>
          <div class="field grow float-field float-field--label-as-placeholder"><div class="float-field__box"><span class="float-field__slot"><select class="select" id="intake-smoking"><option value=""></option><option value="0">ไม่เคย</option><option value="1">นานๆ ครั้ง</option><option value="2">บ่อย</option><option value="3">ทุกวัน</option></select><label for="intake-smoking">ประวัติการสูบบุหรี่</label></span></div></div>
          <div class="field grow float-field float-field--label-as-placeholder"><div class="float-field__box"><span class="float-field__slot"><select class="select" id="intake-alcohol"><option value=""></option><option value="0">ไม่เคย</option><option value="1">นานๆ ครั้ง</option><option value="2">บ่อย</option><option value="3">บ่อยมาก</option></select><label for="intake-alcohol">ประวัติการดื่มแอลกอฮอล์</label></span></div></div>
        </div>
        <p class="intake-privacy-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.7 8.2 7 10 4.3-1.8 7-5.4 7-10V6Z"/><path d="m9 12 2 2 4-4"/></svg><span>Private · We do not disclose your health information without your permission.</span></p>
      </div>
    </div>
    <div class="screen__footer"><button class="btn btn--primary" data-intake-complete data-post-auth="matching" data-general-health-submit>ยืนยันข้อมูลและดำเนินการต่อ</button></div>
  </section>
