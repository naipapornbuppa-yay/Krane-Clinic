<section class="screen" id="identity">
    <div class="screen__top"><button class="back" data-back>‹</button><span class="ttl">Verify your identity</span></div>
    <div class="screen__body stack-4">
      <div class="stack-2"><p class="muted">Required once for first-time sign-up. Your documents are encrypted and used only to verify it's you.</p></div>
      <div class="stack-3">
        <label class="card card--pad-sm row identity-upload" for="identity-id-input" style="border:1px dashed var(--color-line-strong);align-items:center;cursor:pointer">
          <span class="ic" data-demo-icon="id-card"></span>
          <div class="grow"><strong>National ID card</strong><div class="hint">Photo of the front of your Thai ID card.</div></div><span class="muted" data-identity-status="id">Upload</span>
        </label>
        <input id="identity-id-input" class="sr-only" type="file" accept="image/*" data-identity-input="id">
        <label class="card card--pad-sm row identity-upload" for="identity-selfie-input" style="border:1px dashed var(--color-line-strong);align-items:center;cursor:pointer">
          <span class="ic" data-demo-icon="scan-face"></span>
          <div class="grow"><strong>Selfie holding your ID</strong><div class="hint">A photo of you holding your ID card next to your face (physical comparison).</div></div><span class="muted" data-identity-status="selfie">Take photo</span>
        </label>
        <input id="identity-selfie-input" class="sr-only" type="file" accept="image/*" capture="user" data-identity-input="selfie">
      </div>
    <div class="screen__footer stack-2"><button class="btn btn--primary" data-identity-continue disabled>ยืนยันตัวตนและไปต่อ</button></div>
  </section>
