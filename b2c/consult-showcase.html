<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตัวอย่างห้องปรึกษา Krane</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe src="krane-b2c.html?demoStage=consult&amp;showcaseChat=1&amp;v=20261022-real-chat" title="ห้องแชทปรึกษาแพทย์จากแอป Krane" tabindex="-1"></iframe><script>
(()=>{const frame=document.querySelector('iframe');let timer;frame.addEventListener('load',()=>{const doc=frame.contentDocument;const room=doc.querySelector('#consult'),thread=room?.querySelector('.chat-body');if(!thread)return;const style=doc.createElement('style');style.textContent=`#consult .care-journey,#consult .clinical-workspace,#consult [data-rx-bar],#consult [data-plan-card]{display:none!important}#consult.consult--showcase-chat .chat-body>.bubble,#consult.consult--showcase-chat .chat-body>.typing{animation:none!important;opacity:1!important;transform:none!important}#consult .chat-body>.bubble{display:block!important}#consult .chat-body>.typing{display:inline-flex!important}#consult .chat-body>[hidden]{display:none!important}#consult .chat-body{overflow-y:auto}#consult{height:100dvh!important;max-height:100dvh!important}`;doc.head.append(style);const messages=[...thread.querySelectorAll(':scope>.bubble')],typing=thread.querySelector('[data-typing]');if(!typing)return;const reduced=matchMedia('(prefers-reduced-motion:reduce)');let index=0;const reset=()=>{clearTimeout(timer);messages.forEach(m=>m.hidden=true);index=0;typing.hidden=false;thread.append(typing);tick()};const tick=()=>{clearTimeout(timer);if(document.hidden)return;if(reduced.matches){messages.forEach(m=>m.hidden=false);typing.hidden=true;return}if(index===messages.length){typing.hidden=true;timer=setTimeout(reset,4500);return}typing.style.alignSelf=messages[index].classList.contains('bubble--out')?'flex-end':'flex-start';typing.hidden=false;timer=setTimeout(()=>{typing.hidden=true;messages[index].hidden=false;index++;thread.append(typing);thread.scrollTop=thread.scrollHeight;timer=setTimeout(tick,700)},1500)};document.addEventListener('visibilitychange',()=>document.hidden?clearTimeout(timer):tick());reduced.addEventListener('change',reset);reset();document.body.dataset.chatReady="true"})})();
</script></body></html>
