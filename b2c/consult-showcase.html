<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="design-tokens.css?v=20261015-local-fonts"><link rel="stylesheet" href="components.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f7f7f7;color:#1a1e28;font-family:var(--landing-font-body,'Noto Sans Thai',sans-serif)}body{display:flex;flex-direction:column;padding:44px 16px 24px}.room-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 20px;border-bottom:1px solid #e4e6eb}.room-header img{width:145px;height:auto}.room-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#34665d}.room-status:before{content:'';width:6px;height:6px;border-radius:50%;background:#34665d}.thread{display:flex;flex:1;min-height:0;flex-direction:column;gap:14px;padding-top:24px;overflow:hidden}.message{max-width:88%;padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.65;background:#fff;align-self:flex-start}.message.out{align-self:flex-end;background:#e1e7f5}.message[hidden],.typing[hidden]{display:none}.message small{display:block;font-size:11px;color:#647087;margin-bottom:4px}.typing{display:inline-flex;align-self:flex-start;gap:5px;padding:16px;border-radius:20px;background:#fff}.typing.out{align-self:flex-end;background:#e1e7f5}.typing span{width:6px;height:6px;border-radius:50%;background:#7b8393;animation:dot 1.2s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{opacity:.4;transform:none}30%{opacity:1;transform:translateY(-4px)}}.composer{margin-top:18px;padding:12px 16px;background:#fff;border:1px solid #e4e6eb;border-radius:999px;color:#858c98;font-size:13px;display:flex;justify-content:space-between}.composer svg{width:18px;height:18px;color:#3c5eaa}@media(prefers-reduced-motion:reduce){.typing span{animation:none}}
</style></head><body><header class="room-header"><img src="../assets/brand-final/krane-logotype.svg" alt="Krane Clinic"><span class="room-status">ห้องปรึกษา</span></header><main class="thread" aria-label="ตัวอย่างบทสนทนากับแพทย์"><div class="message" hidden><small>แพทย์</small>สวัสดีครับ วันนี้อยากปรึกษาเรื่องอะไรครับ</div><div class="message out" hidden><small>คุณ</small>อยากปรึกษาเรื่องสุขภาพ และแนวทางดูแลที่เหมาะกับตัวเองครับ</div><div class="message" hidden><small>แพทย์</small>ได้ครับ ขอสอบถามอาการและประวัติสุขภาพเพิ่มเติมก่อนนะครับ</div><div class="message out" hidden><small>คุณ</small>ได้เลยครับ</div><div class="message" hidden><small>แพทย์</small>เริ่มมีอาการตั้งแต่เมื่อไหร่ และมีโรคประจำตัวหรือยาที่ใช้อยู่ไหมครับ</div><div class="typing" aria-label="กำลังพิมพ์"><span></span><span></span><span></span></div></main><div class="composer" aria-hidden="true"><span>พิมพ์ข้อความ…</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14"/></svg></div><script>
(()=>{const messages=[...document.querySelectorAll('.message')],typing=document.querySelector('.typing'),thread=document.querySelector('.thread'),reduced=matchMedia('(prefers-reduced-motion:reduce)');let index=0,timer;function reset(){messages.forEach(m=>m.hidden=true);index=0;typing.hidden=false;typing.classList.remove('out');thread.append(typing);tick()}function tick(){clearTimeout(timer);if(document.hidden)return;if(reduced.matches){messages.forEach(m=>m.hidden=false);typing.hidden=true;return}if(index===messages.length){typing.hidden=true;timer=setTimeout(reset,4000);return}typing.classList.toggle('out',messages[index].classList.contains('out'));typing.hidden=false;timer=setTimeout(()=>{typing.hidden=true;messages[index].hidden=false;index++;thread.append(typing);thread.scrollTop=thread.scrollHeight;timer=setTimeout(tick,700)},1500)}document.addEventListener('visibilitychange',()=>document.hidden?clearTimeout(timer):tick());reduced.addEventListener('change',reset);reset()})();
</script></body></html>
