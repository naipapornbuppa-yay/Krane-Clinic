<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krane Clinic · คัดกรองความปลอดภัย</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="review-visuals.css?v=20261127-review-parity">
  <script src="review-safety.js?v=20261127-separate-safety" defer></script>
</head>
<body class="review-safety-page">
  <button type="button" class="btn btn--primary" data-open></button>
  <dialog class="modal-dialog health-history-dialog review-safety-dialog" data-review-safety-root aria-labelledby="safety-heading">
    <button type="button" class="modal-dialog__close" data-close>×</button>
    <span class="modal-dialog__icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-3.5 7-10V5l-7-3-7 3v7c0 6.5 7 10 7 10zM12 8v7M8.5 11.5h7"/></svg>
    </span>
    <h1 id="safety-heading" tabindex="-1"></h1>
    <div class="partner-clinical-grid">
      <fieldset class="partner-history-field">
        <legend id="safety-question"></legend>
        <div class="partner-binary" role="radiogroup" aria-labelledby="safety-question">
          <button type="button" class="partner-binary__option" role="radio" data-answer="no"></button>
          <button type="button" class="partner-binary__option" role="radio" data-answer="yes"></button>
        </div>
      </fieldset>
    </div>
    <div class="alert alert--warning" data-intake-safety-warning role="status" hidden>
      <span class="a-ic" aria-hidden="true">!</span>
      <div><div class="a-title" data-warning-title></div><div class="hint"><span data-warning-line1></span><br><span data-warning-line2></span></div></div>
    </div>
    <div class="modal-dialog__actions">
      <button class="btn btn--primary" type="button" data-next></button>
      <button class="btn btn--ghost" type="button" data-back></button>
    </div>
  </dialog>
</body>
</html>
