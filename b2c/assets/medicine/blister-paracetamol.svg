<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="แผงยาพาราเซตามอล">
  <!-- Paracetamol 500 mg: white oblong caplets with a centre score line. -->
  <defs>
    <linearGradient id="para-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset=".45" stop-color="#dde6f0"/>
      <stop offset=".55" stop-color="#f1f5fa"/>
      <stop offset="1" stop-color="#ccd8e6"/>
    </linearGradient>
    <linearGradient id="para-tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#dbe3ec"/>
    </linearGradient>
    <filter id="para-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#1b2b45" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#para-shadow)">
    <rect x="14" y="14" width="68" height="68" rx="9" fill="url(#para-foil)" stroke="#b6c4d6" stroke-width="1.2"/>
    <path d="M48 14v68" stroke="#b6c4d6" stroke-width=".9" stroke-dasharray="3 3" opacity=".5"/>
    <g>
      <rect x="21" y="24" width="54" height="15" rx="7.5" fill="url(#para-tab)" stroke="#bcc7d5" stroke-width=".9"/>
      <rect x="21" y="45" width="54" height="15" rx="7.5" fill="url(#para-tab)" stroke="#bcc7d5" stroke-width=".9"/>
      <rect x="21" y="66" width="54" height="15" rx="7.5" fill="url(#para-tab)" stroke="#bcc7d5" stroke-width=".9"/>
    </g>
    <g stroke="#c3ccd8" stroke-width="1.1" stroke-linecap="round">
      <path d="M48 27.5v8M48 48.5v8M48 69.5v8"/>
    </g>
    <g fill="#fff" opacity=".65">
      <rect x="26" y="27" width="14" height="3.4" rx="1.7"/>
      <rect x="26" y="48" width="14" height="3.4" rx="1.7"/>
      <rect x="26" y="69" width="14" height="3.4" rx="1.7"/>
    </g>
  </g>
</svg>
