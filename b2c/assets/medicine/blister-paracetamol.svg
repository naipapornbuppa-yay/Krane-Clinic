<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="แผงยาพาราเซตามอล">
  <defs>
    <linearGradient id="paracetamol-foil" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset=".22" stop-color="#dfe7ef"/>
      <stop offset=".40" stop-color="#f6f9fc"/><stop offset=".58" stop-color="#cfdae6"/>
      <stop offset=".78" stop-color="#eef3f8"/><stop offset="1" stop-color="#c2cfdd"/>
