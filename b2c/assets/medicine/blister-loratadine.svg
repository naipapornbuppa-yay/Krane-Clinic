    <linearGradient id="loratadine-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dadc0"/><stop offset="1" stop-color="#7c8ea4"/>
    </linearGradient>
    <radialGradient id="loratadine-dome" cx=".33" cy=".26" r=".9">
