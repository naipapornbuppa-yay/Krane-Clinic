<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังรอเข้าห้องปรึกษา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .pulse{transform-origin:60px 60px;animation:sweep 2.2s ease-out infinite}
  @keyframes sweep{0%{transform:scale(.6);opacity:0}30%{opacity:.75}100%{transform:scale(1.3);opacity:0}}
  .dot{animation:blink 1.4s ease-in-out infinite}
  .dot:nth-of-type(2){animation-delay:.2s}.dot:nth-of-type(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<circle class="s soft pulse" cx="60" cy="60" r="36" stroke-width="3"/>
<rect class="s" x="26" y="42" width="46" height="34" rx="7"/>
<path class="s" d="M72 56l20-11v30L72 64z"/>
<g class="f"><circle class="dot" cx="42" cy="90" r="3.4"/><circle class="dot" cx="55" cy="90" r="3.4"/><circle class="dot" cx="68" cy="90" r="3.4"/></g>
</svg>
