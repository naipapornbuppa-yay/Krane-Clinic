<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังรอเข้าห้องปรึกษา">
<style>
  .s{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#fff}
  .dim{opacity:.55}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .pulse{transform-origin:60px 58px;animation:sweep 2.2s ease-out infinite}
  @keyframes sweep{0%{transform:scale(.55);opacity:0}30%{opacity:.6}100%{transform:scale(1.05);opacity:0}}
  .dot{animation:blink 1.4s ease-in-out infinite}
  .dot:nth-of-type(2){animation-delay:.2s}.dot:nth-of-type(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<circle class="s dim pulse" cx="60" cy="58" r="46" stroke-width="4"/>
<rect class="s" x="24" y="38" width="46" height="34" rx="8"/>
<path class="s" d="M70 52l22-12v32L70 60z"/>
<g class="f"><circle class="dot" cx="43" cy="90" r="4"/><circle class="dot" cx="60" cy="90" r="4"/><circle class="dot" cx="77" cy="90" r="4"/></g>
</svg>
