<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังเตรียมข้อมูลของคุณ">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .beat{stroke-dasharray:120;stroke-dashoffset:120;animation:trace 2s linear infinite}
  @keyframes trace{0%{stroke-dashoffset:120}70%,100%{stroke-dashoffset:-120}}
  .heart{transform-origin:60px 46px;animation:thump 1.4s ease-in-out infinite}
  @keyframes thump{0%,100%{transform:scale(1)}18%{transform:scale(1.12)}36%{transform:scale(1)}54%{transform:scale(1.07)}}
</style>
<g class="heart"><path class="s" d="M60 68S36 54 36 40a13 13 0 0 1 24-7 13 13 0 0 1 24 7c0 14-24 28-24 28z"/></g>
<path class="s soft" d="M24 88h72" stroke-width="3" opacity=".45"/>
<path class="s beat" d="M24 88h16l6-14 9 28 8-20 6 6h27"/>
</svg>
