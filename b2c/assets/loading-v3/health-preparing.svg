<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังเตรียมข้อมูลของคุณ">
<style>
  .s{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#fff}
  .dim{opacity:.55}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .beat{stroke-dasharray:130;stroke-dashoffset:130;animation:trace 2s linear infinite}
  @keyframes trace{0%{stroke-dashoffset:130}70%,100%{stroke-dashoffset:-130}}
  .heart{transform-origin:60px 44px;animation:thump 1.4s ease-in-out infinite}
  @keyframes thump{0%,100%{transform:scale(1)}18%{transform:scale(1.12)}36%{transform:scale(1)}54%{transform:scale(1.06)}}
</style>
<g class="heart"><path class="s" d="M60 70S32 54 32 36a14 14 0 0 1 28-7 14 14 0 0 1 28 7c0 18-28 34-28 34z"/></g>
<path class="s dim" d="M20 90h80" stroke-width="4" opacity=".35"/>
<path class="s beat" d="M20 90h18l7-16 10 32 9-22 7 6h29"/>
</svg>
