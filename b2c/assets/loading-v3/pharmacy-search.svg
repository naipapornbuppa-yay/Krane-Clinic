<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังหาร้านยา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .dim{opacity:.32}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .wave{transform-origin:60px 58px;animation:wave 3.2s ease-out infinite}
  .wave2{animation-delay:1.06s}.wave3{animation-delay:2.12s}
  @keyframes wave{0%{transform:scale(.32);opacity:0}28%{opacity:.45}100%{transform:scale(1.02);opacity:0}}
  .pin{transform-origin:60px 74px;animation:pin 3.2s ease-in-out infinite}
  @keyframes pin{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(1.5px)}}
</style>
<circle class="s dim wave" cx="60" cy="58" r="48" stroke-width="3.5"/>
<circle class="s dim wave wave2" cx="60" cy="58" r="48" stroke-width="3.5"/>
<circle class="s dim wave wave3" cx="60" cy="58" r="48" stroke-width="3.5"/>
<g class="pin"><path class="s" d="M60 20a20 20 0 0 1 20 20c0 15-20 34-20 34S40 55 40 40a20 20 0 0 1 20-20z"/><circle class="f" cx="60" cy="40" r="7"/></g>
<path class="s dim" d="M32 98h56" stroke-width="5"/>
</svg>
