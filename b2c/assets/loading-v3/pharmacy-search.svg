<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังหาร้านยา">
<style>
  .s{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#fff}
  .dim{opacity:.55}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .wave{transform-origin:60px 58px;animation:out 2.2s ease-out infinite}
  .wave2{animation-delay:.73s}.wave3{animation-delay:1.46s}
  @keyframes out{0%{transform:scale(.3);opacity:0}25%{opacity:.6}100%{transform:scale(1.05);opacity:0}}
  .pin{transform-origin:60px 58px;animation:drop 2.2s ease-in-out infinite}
  @keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<circle class="s dim wave" cx="60" cy="58" r="48" stroke-width="4"/>
<circle class="s dim wave wave2" cx="60" cy="58" r="48" stroke-width="4"/>
<circle class="s dim wave wave3" cx="60" cy="58" r="48" stroke-width="4"/>
<g class="pin"><path class="s" d="M60 20a20 20 0 0 1 20 20c0 15-20 34-20 34S40 55 40 40a20 20 0 0 1 20-20z"/><circle class="f" cx="60" cy="40" r="7"/></g>
<path class="s dim" d="M32 98h56" stroke-width="5"/>
</svg>
