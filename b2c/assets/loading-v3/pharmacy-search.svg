<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังหาร้านยา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .wave{transform-origin:60px 62px;animation:out 2.2s ease-out infinite}
  .wave2{animation-delay:.7s}.wave3{animation-delay:1.4s}
  @keyframes out{0%{transform:scale(.35);opacity:0}25%{opacity:.8}100%{transform:scale(1.2);opacity:0}}
  .pin{transform-origin:60px 62px;animation:drop 2.2s ease-in-out infinite}
  @keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<circle class="s soft wave" cx="60" cy="62" r="40" stroke-width="3"/>
<circle class="s soft wave wave2" cx="60" cy="62" r="40" stroke-width="3"/>
<circle class="s soft wave wave3" cx="60" cy="62" r="40" stroke-width="3"/>
<g class="pin"><path class="s" d="M60 26a18 18 0 0 1 18 18c0 13-18 30-18 30S42 57 42 44a18 18 0 0 1 18-18z"/><circle class="f" cx="60" cy="44" r="6"/></g>
<path class="s soft" d="M34 96h52" stroke-width="4"/>
</svg>
