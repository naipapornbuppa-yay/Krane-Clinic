<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังค้นหาคุณหมอ">
<style>
  .s{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#fff}
  .dim{opacity:.55}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .ring{transform-origin:60px 60px;animation:sweep 2.4s cubic-bezier(.4,0,.2,1) infinite}
  .ring2{animation-delay:1.2s}
  @keyframes sweep{0%{transform:scale(.5);opacity:0}35%{opacity:.7}100%{transform:scale(1.05);opacity:0}}
  .bell{transform-origin:76px 72px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<circle class="s dim ring" cx="60" cy="60" r="46" stroke-width="4"/>
<circle class="s dim ring ring2" cx="60" cy="60" r="46" stroke-width="4"/>
<path class="s" d="M40 26v16a14 14 0 0 0 28 0V26"/>
<path class="s" d="M36 26h8M64 26h8"/>
<g class="bell"><path class="s" d="M54 56v6a16 16 0 0 0 23 13.6"/><circle class="s" cx="80" cy="72" r="9"/></g>
</svg>
