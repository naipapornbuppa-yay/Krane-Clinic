<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ร้านยากำลังจัดยา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .drop{animation:fall 2.4s ease-in infinite}
  .drop2{animation-delay:.8s}
  @keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}55%,100%{transform:translateY(0);opacity:0}}
  .lid{transform-origin:60px 52px;animation:flap 2.4s ease-in-out infinite}
  @keyframes flap{0%,45%{transform:rotate(0)}60%,100%{transform:rotate(-6deg)}}
</style>
<g class="f"><circle class="drop" cx="52" cy="40" r="5"/><circle class="drop drop2" cx="70" cy="40" r="5"/></g>
<path class="s" d="M28 56h64v38a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6z"/>
<g class="lid"><path class="s" d="M24 44h72v12H24z"/></g>
<path class="s soft" d="M60 62v34" stroke-width="4"/>
</svg>
