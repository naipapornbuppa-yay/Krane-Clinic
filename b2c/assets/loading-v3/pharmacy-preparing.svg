<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ร้านยากำลังจัดยา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .dim{opacity:.32}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .drop{animation:fall 3.2s ease-in infinite}
  .drop2{animation-delay:1.1s}
  @keyframes fall{0%{transform:translateY(-22px);opacity:0}22%{opacity:1}52%,100%{transform:translateY(0);opacity:0}}
  .lid{transform-origin:60px 50px;animation:lid 3.2s ease-in-out infinite}
  @keyframes lid{0%,48%{transform:rotate(0)}64%,100%{transform:rotate(-4deg)}}
</style>
<g class="f"><circle class="drop" cx="50" cy="34" r="6"/><circle class="drop drop2" cx="70" cy="34" r="6"/></g>
<path class="s" d="M26 54h68v42a6 6 0 0 1-6 6H32a6 6 0 0 1-6-6z"/>
<g class="lid"><path class="s" d="M22 40h76v14H22z"/></g>
<path class="s dim" d="M60 60v38" stroke-width="5"/>
</svg>
