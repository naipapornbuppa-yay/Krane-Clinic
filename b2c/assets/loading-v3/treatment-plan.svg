<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="คุณหมอกำลังสรุปแผนการรักษา">
<style>
  .s{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#fff}
  .dim{opacity:.55}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .ln{stroke-dasharray:34;stroke-dashoffset:34;animation:write 3s ease-in-out infinite}
  .ln2{animation-delay:.5s}.ln3{animation-delay:1s}
  @keyframes write{0%{stroke-dashoffset:34}30%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.4}}
  .pen{animation:glide 3s ease-in-out infinite}
  @keyframes glide{0%{transform:translateY(0)}30%{transform:translateY(12px)}60%,100%{transform:translateY(24px)}}
</style>
<rect class="s" x="26" y="22" width="68" height="80" rx="10"/>
<path class="s" d="M46 22a14 14 0 0 1 28 0"/>
<g class="s dim" stroke-width="5"><path class="ln" d="M42 50h36"/><path class="ln ln2" d="M42 64h36"/><path class="ln ln3" d="M42 78h24"/></g>
<g class="pen"><path class="s" d="M80 40l9 9-20 20-11 2 2-11z"/></g>
</svg>
