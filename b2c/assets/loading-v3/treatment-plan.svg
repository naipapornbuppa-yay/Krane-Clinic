<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="คุณหมอกำลังสรุปแผนการรักษา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .ln{stroke-dasharray:34;stroke-dashoffset:34;animation:write 3s ease-in-out infinite}
  .ln2{animation-delay:.5s}.ln3{animation-delay:1s}
  @keyframes write{0%{stroke-dashoffset:34}30%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.35}}
  .pen{animation:glide 3s ease-in-out infinite}
  @keyframes glide{0%{transform:translate(0,0)}30%{transform:translate(0,11px)}60%{transform:translate(0,22px)}100%{transform:translate(0,22px)}}
</style>
<rect class="s" x="30" y="24" width="60" height="76" rx="8"/>
<path class="s" d="M48 24a12 12 0 0 1 24 0"/>
<g class="s soft" stroke-width="4"><path class="ln" d="M44 50h32"/><path class="ln ln2" d="M44 63h32"/><path class="ln ln3" d="M44 76h22"/></g>
<g class="pen"><path class="s" d="M78 44l8 8-18 18-10 2 2-10z"/></g>
</svg>
