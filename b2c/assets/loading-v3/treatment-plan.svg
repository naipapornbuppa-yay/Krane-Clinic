<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="คุณหมอกำลังสรุปแผนการรักษา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .dim{opacity:.32}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .ln{stroke-dasharray:36;stroke-dashoffset:36;animation:write 3.6s ease-in-out infinite}
  .ln2{animation-delay:.6s}.ln3{animation-delay:1.2s}
  @keyframes write{0%{stroke-dashoffset:36}32%,72%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.35}}
  .pen{animation:glide 3.6s ease-in-out infinite}
  @keyframes glide{0%{transform:translateY(0)}32%{transform:translateY(13px)}64%,100%{transform:translateY(26px)}}
</style>
<rect class="s" x="26" y="22" width="68" height="80" rx="10"/>
<path class="s" d="M46 22a14 14 0 0 1 28 0"/>
