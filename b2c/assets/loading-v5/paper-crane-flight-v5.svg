<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Traditional paper crane flying" shape-rendering="geometricPrecision">
  <style>
    .outline{stroke:#173963;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .pencil{fill:none;stroke:#6e86a5;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;opacity:.5;vector-effect:non-scaling-stroke}
    .detail{fill:none;stroke:#6e86a5;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82;vector-effect:non-scaling-stroke}
    .motion{fill:none;stroke:#8da1ba;stroke-width:1;stroke-linecap:round;opacity:.48;vector-effect:non-scaling-stroke}
    .paper{fill:#fcf7ef}.blue{fill:#d7e4f3}.sage{fill:#dce4d8}
  </style>

  <!-- Traditional orizuru anatomy: a long rising neck with a reverse-folded
       beak at the front, one tapered tail point at the back, and broad wings. -->
  <g transform="translate(278 177)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="-7 3;0 -5;7 1;0 5;-7 3" keyTimes="0;.25;.5;.75;1"
      dur="1.7s" repeatCount="indefinite"/>

    <g class="wing-frame wing-frame--up">
      <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-8 3-137-107-53 49Z"/>
      <path class="pencil" d="M-10 3-133-103-52 46Z"/>
      <path class="detail" d="M-15 4-103-78M-83-58l17 11M-98-72l15 10"/>
      <path class="blue outline" d="M8 3 129-114 57 49Z"/>
      <path class="pencil" d="M10 3 125-109 56 46Z"/>
      <path class="detail" d="M17 4 98-84M37 22 76-39M88-72l16-17M77-58l15-16"/>
    </g>

    <g class="wing-frame wing-frame--middle-a">
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-8 3-171-43-53 49Z"/>
      <path class="pencil" d="M-10 3-166-41-52 46Z"/>
      <path class="detail" d="M-16 4-128-31M-98-24l18 5M-115-32l16 5"/>
      <path class="blue outline" d="M8 3 158-61 57 49Z"/>
      <path class="pencil" d="M10 3 153-58 56 46Z"/>
      <path class="detail" d="M17 4 119-44M40 22 90-24M108-39l18-8M94-30l17-8"/>
    </g>

    <g class="wing-frame wing-frame--down">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-8 3-151 65-53 49Z"/>
      <path class="pencil" d="M-10 3-146 62-52 46Z"/>
      <path class="detail" d="M-16 5-114 50M-88 40l18-5M-103 48l16-5"/>
      <path class="blue outline" d="M8 3 143 71 57 49Z"/>
      <path class="pencil" d="M10 3 139 68 56 46Z"/>
      <path class="detail" d="M18 5 108 55M42 23 81 51M96 57l18 9M83 51l17 8"/>
    </g>

    <g class="wing-frame wing-frame--middle-b">
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="1.7s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-8 3-166-51-53 49Z"/>
      <path class="pencil" d="M-10 3-161-49-52 46Z"/>
      <path class="detail" d="M-16 4-124-37M-95-29l18 6M-111-38l16 6"/>
      <path class="blue outline" d="M8 3 162-53 57 49Z"/>
      <path class="pencil" d="M10 3 157-51 56 46Z"/>
      <path class="detail" d="M17 4 121-38M40 22 92-20M110-34l18-7M96-25l17-7"/>
    </g>

    <!-- One long rear tail point, clearly separate from the left wing. -->
    <path class="paper outline" d="M-49 29-142-97-88 10-60 58Z"/>
    <path class="pencil" d="M-48 27-137-91-86 11-59 54Z"/>
    <path class="detail" d="M-52 26-94-32"/>

    <!-- Long front neck rises from the body, then reverse-folds into a
         small head and downward-pointing beak. -->
    <path class="paper outline" d="M47 29 101-13 132-64 147-55 121-20 65 58Z"/>
    <path class="pencil" d="M49 28 103-12 133-61 144-54 119-19 65 54Z"/>
    <path class="detail" d="M65 50 111-13 135-51"/>
    <path class="blue outline" d="M132-64 147-55 127-41 173-7 157-3 116-31Z"/>
    <path class="pencil" d="M134-61 145-54 126-40 168-8 157-5 119-31Z"/>
    <path class="detail" d="M127-41 116-31M147-55 157-3"/>

    <path class="sage outline" d="M0-26 63 31 3 94-64 36Z"/>
    <path class="pencil" d="M1-23 60 31 3 90-61 36Z"/>
    <path class="detail" d="M0-20 35 12M-21 47l14 11M-13 39 1 51"/>

    <path class="motion" d="M-151 73h-34M-160 59h-27M-158 87h-22">
      <animate attributeName="opacity" values=".2;.65;.2" dur="1.7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
