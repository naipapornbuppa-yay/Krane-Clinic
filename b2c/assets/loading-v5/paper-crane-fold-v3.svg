<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Paper folding into an origami crane" shape-rendering="geometricPrecision">
  <style>
    .outline{stroke:#173963;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .pencil{fill:none;stroke:#6e86a5;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;opacity:.5;vector-effect:non-scaling-stroke}
    .detail{fill:none;stroke:#6e86a5;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82;vector-effect:non-scaling-stroke}
    .crease{fill:none;stroke:#7d92ad;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:7 9;opacity:.72;vector-effect:non-scaling-stroke}
    .paper{fill:#fcf7ef}.blue{fill:#d7e4f3}.sage{fill:#dce4d8}
  </style>

  <!-- The paper switches stages only while edge-on. Visible strokes are thin,
       slightly doubled pencil lines matching the editorial character artwork. -->
  <g transform="translate(280 177)">
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.299;.3;.999;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 1;1 1;1 .05;1 .05" keyTimes="0;.08;.18;.3;1" dur="5.2s" repeatCount="indefinite"/>
      <path class="paper outline" d="M0-112 111-2 2 112-112 1Z"/>
      <path class="pencil" d="M1-110 109-2 2 110-110 1Z"/>
      <path class="crease" d="M0-106 2 107M-106 0 106-1"/>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.299;.3;.519;.52;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 .05;1 1;1 .05;1 .05" keyTimes="0;.3;.42;.52;1" dur="5.2s" repeatCount="indefinite"/>
      <path class="blue outline" d="M0-87 100 1 1 88-101 0Z" transform="translate(0 12)"/>
      <path class="paper outline" d="M0-94 105-1 1 94-106 1Z"/>
      <path class="sage outline" d="M-106 1 1 94 105-1 1 32Z"/>
      <path class="pencil" d="M-103 1 1 91 102 0"/>
      <path class="detail" d="M0-88 1 88"/>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.519;.52;.999;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 .05;1 1;1 1;1 .05" keyTimes="0;.52;.6;.96;1" dur="5.2s" repeatCount="indefinite"/>

      <g transform="translate(-10 -16)"><g>
        <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.58;.78;1" dur="5.2s" repeatCount="indefinite"/>
        <path class="paper outline" d="M0 0-145-68-48 51Z"/>
        <path class="pencil" d="M-2 1-142-66-47 49Z"/>
        <path class="detail" d="M-7 3-105-49M-78-34l17 8M-92-44l15 8"/>
      </g></g>

      <g transform="translate(10 -16)"><g>
        <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.62;.82;1" dur="5.2s" repeatCount="indefinite"/>
        <path class="blue outline" d="M0 0 145-92 52 51Z"/>
        <path class="pencil" d="M2 0 142-89 51 48Z"/>
        <path class="detail" d="M14 2 108-67M31 17 78-29M94-53l19-13M82-41l17-12"/>
      </g></g>

      <g transform="translate(-55 34)"><g>
        <animateTransform attributeName="transform" type="scale" values="1 .035;1 .035;1 1;1 1" keyTimes="0;.58;.8;1" dur="5.2s" repeatCount="indefinite"/>
        <path class="paper outline" d="M0 0-14-82-54-112-39-122 4-87 46-49Z"/>
        <path class="pencil" d="M1-1-12-80-52-111-39-120 5-85 44-49Z"/>
        <path class="blue outline" d="M-54-112-39-122-30-102Z"/>
        <path class="detail" d="M-13-78 4-87M-17-91l9 6"/>
      </g></g>

      <g transform="translate(55 34)"><g>
        <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.66;.84;1" dur="5.2s" repeatCount="indefinite"/>
        <path class="paper outline" d="M0 0 98-24 9 32Z"/>
        <path class="pencil" d="M2 1 94-22 10 30Z"/>
      </g></g>

      <path class="sage outline" d="M0-25 61 32 2 92-62 35Z"/>
      <path class="pencil" d="M1-23 59 32 2 90-60 35Z"/>
      <path class="detail" d="M0-20 33 12M-19 45l13 11M-12 38 1 50"/>
    </g>
  </g>
</svg>
