<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of prescribed injection pens and oral medicines</title>
  <desc id="desc">A crisp navy line illustration showing two injection pens with blister-packed round and oval tablets.</desc>
  <defs>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fcff"/>
      <stop offset="0.55" stop-color="#cbd9ea"/>
      <stop offset="1" stop-color="#f4f8fc"/>
    </linearGradient>
    <linearGradient id="blueTablet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e9fb"/>
      <stop offset="1" stop-color="#9fbde0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#173651" flood-opacity=".14"/>
    </filter>
  </defs>

  <g fill="none" stroke="#123a6b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- rear injection pen -->
    <g transform="translate(590 82) rotate(14 130 320)">
      <rect x="76" y="20" width="112" height="122" rx="38" fill="#b8cdeb"/>
      <path d="M76 120h112"/>
      <rect x="58" y="122" width="148" height="500" rx="58" fill="url(#penBody)"/>
      <rect x="91" y="250" width="82" height="154" rx="30" fill="#edf3fb"/>
      <rect x="108" y="278" width="48" height="98" rx="18" fill="#aec6e5" stroke-width="6"/>
      <path d="M132 292v70M114 326h36" stroke-width="5" opacity=".7"/>
      <path d="M86 492h92" stroke-width="6" opacity=".45"/>
      <path d="M82 534h100" stroke-width="6" opacity=".45"/>
      <rect x="88" y="620" width="88" height="66" rx="30" fill="#dbe7f5"/>
      <path d="M107 650h50" stroke-width="5"/>
    </g>

    <!-- front injection pen -->
    <g transform="translate(390 22) rotate(-8 130 350)">
      <rect x="70" y="28" width="126" height="148" rx="42" fill="#ddd3ef"/>
      <path d="M70 152h126"/>
      <rect x="52" y="154" width="162" height="532" rx="62" fill="url(#penBody)"/>
      <rect x="88" y="306" width="90" height="172" rx="31" fill="#f4f7fb"/>
      <rect x="107" y="337" width="52" height="108" rx="18" fill="#d7c9ee" stroke-width="6"/>
      <path d="M133 353v76M113 392h40" stroke-width="5" opacity=".72"/>
      <path d="M86 544h94" stroke-width="6" opacity=".42"/>
      <path d="M82 588h102" stroke-width="6" opacity=".42"/>
      <rect x="89" y="684" width="90" height="68" rx="31" fill="#efe8f7"/>
      <path d="M109 718h50" stroke-width="5"/>
    </g>

    <!-- white-tablet blister, matching the oral medicine list without brand claims -->
    <g transform="translate(95 398) rotate(-13 185 205)">
      <rect x="18" y="16" width="350" height="404" rx="48" fill="url(#foil)"/>
      <path d="M55 62h276M55 374h276" stroke="#8ba3bf" stroke-width="5" opacity=".75"/>
      <g fill="#fffdfa" stroke-width="7">
        <circle cx="112" cy="120" r="50"/><circle cx="266" cy="120" r="50"/>
        <circle cx="112" cy="218" r="50"/><circle cx="266" cy="218" r="50"/>
        <circle cx="112" cy="316" r="50"/><circle cx="266" cy="316" r="50"/>
      </g>
      <g stroke="#afbdd0" stroke-width="5" opacity=".78">
        <path d="M84 103c20-24 46-29 69-8"/><path d="M238 103c20-24 46-29 69-8"/>
        <path d="M84 201c20-24 46-29 69-8"/><path d="M238 201c20-24 46-29 69-8"/>
        <path d="M84 299c20-24 46-29 69-8"/><path d="M238 299c20-24 46-29 69-8"/>
      </g>
    </g>

    <!-- blue oval-tablet blister -->
    <g transform="translate(790 400) rotate(12 150 210)">
      <rect x="20" y="18" width="292" height="418" rx="46" fill="url(#foil)"/>
      <path d="M58 70h216M58 386h216" stroke="#8ba3bf" stroke-width="5" opacity=".75"/>
      <g fill="url(#blueTablet)" stroke-width="7">
        <rect x="78" y="86" width="176" height="64" rx="32"/>
        <rect x="78" y="172" width="176" height="64" rx="32"/>
        <rect x="78" y="258" width="176" height="64" rx="32"/>
      </g>
      <g stroke="#6f92be" stroke-width="5" opacity=".72">
        <path d="M164 94v48M164 180v48M164 266v48"/>
      </g>
    </g>

    <!-- two loose tablet forms for the general-care oral set -->
    <g transform="translate(670 705)">
      <rect x="0" y="0" width="118" height="58" rx="29" fill="#f6d4c8" transform="rotate(-18 59 29)"/>
      <path d="M59 2v54" transform="rotate(-18 59 29)" stroke-width="5" opacity=".7"/>
      <circle cx="156" cy="34" r="34" fill="#fff7df"/>
      <path d="M130 34h52" stroke-width="5" opacity=".6"/>
    </g>
  </g>

  <g fill="#123a6b" opacity=".34">
    <circle cx="340" cy="168" r="7"/><circle cx="873" cy="145" r="7"/>
    <path d="M304 132h50v6h-50z" transform="rotate(-28 329 135)"/>
    <path d="M896 106h50v6h-50z" transform="rotate(28 921 109)"/>
  </g>
</svg>
