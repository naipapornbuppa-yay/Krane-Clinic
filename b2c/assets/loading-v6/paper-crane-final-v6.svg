<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Origami paper crane" shape-rendering="geometricPrecision">
  <style>
    .outline{stroke:#173963;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .fold{fill:none;stroke:#6e86a5;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.72;vector-effect:non-scaling-stroke}
    .paper{fill:#fcf7ef}.blue{fill:#d7e4f3}.sage{fill:#dce4d8}
  </style>
  <g>
    <!-- Tail: one long rear point. -->
    <path class="paper outline" d="M198 187 69 72 181 222Z"/>
    <path class="fold" d="m195 187-86-76 72 106"/>

    <!-- Long neck, small head, and a single pointed beak. -->
    <path class="paper outline" d="m350 207 70-78 37-34 20 8-72 112-39 12Z"/>
    <path class="fold" d="m365 218 73-98 24-18"/>
    <path class="blue outline" d="m457 95 20 8 34 33-31-18-18 1-15-11Z"/>
    <path class="fold" d="m462 119 15-16 3 15"/>

    <!-- Upper and lower wings hinge from the same compact body. -->
    <path class="blue outline" d="m195 181 135-143 35 127-65 31-8-52-71 58Z"/>
    <path class="fold" d="m203 181 88-37 39-106m-39 106 9 52"/>
    <path class="paper outline" d="m190 190 46 112 129-112-73-46Z"/>
    <path class="fold" d="m196 192 96-48 67 46m-123 106 56-152"/>

    <!-- Compact body keeps the silhouette readable at loading size. -->
    <path class="sage outline" d="m190 190 102-46 73 46-80 48-55-17Z"/>
    <path class="fold" d="m196 191 89 47 7-94m-62 77 62-77 67 45"/>
  </g>
</svg>
