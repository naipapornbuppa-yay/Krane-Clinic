<section class="assessment"><div class="container"><h2 data-th="เรื่องเล็ก ๆ ที่ช่วยให้<br>รู้จักเส้นผมคุณมากขึ้น" data-en="The details that help<br>tell your hair’s story."></h2><div class="fact-grid"><article><span class="fact-symbol">↗</span><h3 data-th="รูปแบบผมร่วง" data-en="Your hair pattern"></h3><p data-th="แนวไรผม กลางศีรษะ เป็นหย่อม หรือร่วงกระจาย" data-en="Hairline, crown, patches or diffuse shedding."></p></article><article><span class="fact-symbol">◷</span><h3 data-th="ระยะเวลา" data-en="The timeline"></h3><p data-th="เริ่มเมื่อไร เปลี่ยนเร็วเพียงใด และมีเหตุการณ์กระตุ้นหรือไม่" data-en="When it began, how quickly it changed and any possible triggers."></p></article><article><span class="fact-symbol">◎</span><h3 data-th="หนังศีรษะ" data-en="Scalp health"></h3><p data-th="อาการคัน แดง สะเก็ด แผล หรือการอักเสบ" data-en="Itching, redness, flakes, sores or inflammation."></p></article><article><span class="fact-symbol">＋</span><h3 data-th="ประวัติสุขภาพ" data-en="Your health history"></h3><p data-th="ยา โภชนาการ ความเครียด และประวัติผมบางในครอบครัว" data-en="Medication, nutrition, stress and family history."></p></article></div></div></section>
<section class="container journey" id="care"><div class="journey-heading"><h2 data-th="ไม่ต้องเดา<br>ไปคนเดียว" data-en="You don’t have to<br>figure it out alone."></h2><p data-th="เริ่มต้นด้วยข้อมูลที่ชัดเจน และทบทวนการดูแลไปพร้อมกับแพทย์" data-en="Start with a clearer picture, then review your care with a doctor."></p><button class="primary consult" data-th="เริ่มคุยเรื่องเส้นผม <span>↗</span>" data-en="Start the conversation <span>↗</span>"></button></div><div class="steps"><details open><summary><span class="step-no">01</span><span data-th="เล่าเรื่องสุขภาพเส้นผม" data-en="Share your hair history"></span></summary><p data-th="เตรียมข้อมูลรูปแบบและระยะเวลาที่ผมร่วง อาการบนหนังศีรษะ ยาและอาหารเสริมที่ใช้ รวมถึงภาพถ่ายติดตาม" data-en="Prepare your hair-loss history, scalp symptoms, medications, supplements and progress photos."></p></details><details><summary><span class="step-no">02</span><span data-th="ประเมินและวางแผนกับแพทย์" data-en="Discuss a plan with your doctor"></span></summary><p data-th="แพทย์ประเมินสาเหตุและข้อควรระวัง แล้วแนะนำการดูแลที่เหมาะสม หากจำเป็นอาจแนะนำให้ตรวจเพิ่มเติม" data-en="Your doctor assesses possible causes and precautions, recommends appropriate care and may suggest further assessment."></p></details><details><summary><span class="step-no">03</span><span data-th="เริ่มดูแลตามแผน" data-en="Begin your care plan"></span></summary><p data-th="ทำตามคำแนะนำที่ได้รับ และถามแพทย์หรือเภสัชกรเมื่อมีข้อสงสัยเกี่ยวกับการใช้ยา" data-en="Follow the advice you receive and ask your doctor or pharmacist about medication questions."></p></details><details><summary><span class="step-no">04</span><span data-th="ติดตามและทบทวนร่วมกัน" data-en="Review your progress together"></span></summary><p data-th="บันทึกการเปลี่ยนแปลงและอาการที่พบ เพื่อให้แพทย์ทบทวนแผนตามความเหมาะสม ไม่มีระยะเวลาหรือผลลัพธ์ที่รับประกันสำหรับทุกคน" data-en="Record changes and symptoms so your doctor can review the plan. There is no guaranteed timeline or result for everyone."></p></details></div></section>
<section class="faq-section" id="questions"><div class="container faq-grid"><div><h2 data-th="สิ่งที่คุณ<br>อยากรู้" data-en="Good questions.<br>Clearer answers."></h2></div><div class="questions"><details><summary data-th="ควรเตรียมอะไรสำหรับการประเมิน?" data-en="What should I prepare for an assessment?"></summary><p data-th="ข้อมูลอาการ ระยะเวลา ประวัติสุขภาพ ยาหรืออาหารเสริมที่ใช้ และภาพเส้นผมในมุมและแสงใกล้เคียงกัน" data-en="Your symptoms, timeline, health history, medication or supplements, and hair photos in consistent lighting and angles."></p></details><details><summary data-th="มีทางเลือกในการดูแลอะไรบ้าง?" data-en="What care options may be considered?"></summary><p data-th="มีทั้งการปรับพฤติกรรม ยาทา และยารับประทาน การเลือกวิธีขึ้นอยู่กับสาเหตุและข้อควรระวังของแต่ละคน ไม่ควรเริ่มยาโดยไม่มีคำแนะนำที่เหมาะสม" data-en="Options may include lifestyle changes, topical or oral medication. The choice depends on the cause and individual precautions; seek appropriate advice before starting medication."></p></details><details><summary data-th="เมื่อไรควรพบแพทย์โดยตรง?" data-en="When should I seek an in-person assessment?"></summary><p data-th="หากผมร่วงฉับพลัน เป็นหย่อม หรือมีแผลบนหนังศีรษะ ควรพบแพทย์เพื่อประเมินเพิ่มเติม" data-en="Sudden or patchy hair loss, or sores on the scalp, should be assessed by a doctor."></p></details><details><summary data-th="ภาพบนหน้านี้แสดงผลการรักษาหรือไม่?" data-en="Do the visuals show treatment results?"></summary><p data-th="ไม่ใช่ ภาพและวิดีโอในหน้านี้เป็นภาพประกอบโปรแกรมสำหรับตัวอย่างดีไซน์ ไม่ใช่รีวิวจากผู้ป่วยหรือการรับประกันผลลัพธ์" data-en="No. These images and videos are illustrative programme visuals for a design concept, not patient testimonials or guaranteed results."></p></details><details><summary data-th="กดเริ่มประเมินแล้วจะเกิดอะไรขึ้น?" data-en="What happens when I select Get started?"></summary><p data-th="คุณจะไปยังแบบประเมินสุขภาพเส้นผมของ Krane เพื่อเตรียมข้อมูลก่อนปรึกษาแพทย์" data-en="You will continue to Krane’s hair-health assessment to prepare for a medical consultation."></p></details></div></div></section>
