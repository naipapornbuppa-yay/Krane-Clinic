<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f7f9fb">
  <title>ไม่พบหน้านี้ | Krane Clinic</title>
  <link rel="stylesheet" href="./b2c/design-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html { min-width: 320px; background: #f7f9fb; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: #121824;
      background:
        radial-gradient(circle at 10% 10%, rgba(198, 204, 220, .2), transparent 30rem),
        #f7f9fb;
      font-family: var(--font-base, "Noto Sans Thai", sans-serif);
    }

    a { color: inherit; }

    .site-header {
      width: min(1180px, calc(100% - 48px));
      height: 104px;
      margin: 0 auto;
      display: flex;
      align-items: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 168px;
      height: auto;
    }

    main {
      width: min(1180px, calc(100% - 48px));
      min-height: calc(100vh - 104px);
      min-height: calc(100svh - 104px);
      margin: 0 auto;
      padding: 32px 0 72px;
      display: grid;
      place-items: center;
    }

    .not-found {
      position: relative;
      width: 100%;
      min-height: 610px;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, .93fr) minmax(380px, 1.07fr);
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding: clamp(48px, 7vw, 96px);
      border: 1px solid #e4e7ec;
      border-radius: 48px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(18, 24, 36, .08);
      isolation: isolate;
    }

    .not-found::before {
      content: "404";
      position: absolute;
      top: -70px;
      right: 18px;
      z-index: -1;
      color: #f1f3f7;
      font-family: var(--font-display, "Prompt", sans-serif);
      font-size: clamp(180px, 24vw, 330px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.08em;
      user-select: none;
    }

    .copy { max-width: 510px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px;
      color: #5369aa;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      border-radius: 99px;
      background: currentColor;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: var(--font-display, "Prompt", sans-serif);
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.03em;
    }

    .description {
      max-width: 40ch;
      margin: 24px 0 0;
      color: #667085;
      font-size: clamp(16px, 1.5vw, 18px);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .button {
      min-height: 54px;
      padding: 0 24px;
      border: 1px solid #121824;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .18s ease, background-color .18s ease, color .18s ease;
    }

    .button:hover { transform: translateY(-2px); }

    .button:focus-visible {
      outline: 3px solid rgba(83, 105, 170, .35);
      outline-offset: 3px;
    }

    .button--primary { color: #fff; background: #121824; }
    .button--secondary { color: #121824; background: transparent; border-color: #cfd4dc; }

    .button svg { width: 18px; height: 18px; flex: none; }

    .art {
      position: relative;
      min-height: 390px;
      display: grid;
      place-items: center;
      border-radius: 50% 44% 48% 42%;
      background: #eef0f7;
      transform: rotate(-2deg);
    }

    .art::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: 44px;
      width: 76px;
      height: 76px;
      border: 2px solid #c6ccdc;
      border-radius: 50%;
    }

    .art img {
      position: relative;
      z-index: 1;
      width: min(112%, 610px);
      max-width: none;
      height: auto;
      transform: rotate(2deg) translateY(12px);
      filter: drop-shadow(0 18px 18px rgba(18, 24, 36, .08));
    }

    @media (max-width: 820px) {
      .site-header { width: min(100% - 32px, 680px); height: 82px; }
      .brand img { width: 146px; }

      main {
        width: min(100% - 32px, 680px);
        min-height: calc(100svh - 82px);
        padding: 12px 0 32px;
      }

      .not-found {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 44px 28px 34px;
        border-radius: 32px;
      }

      .not-found::before { top: -28px; right: 2px; font-size: 180px; }
      h1 { max-width: 12ch; font-size: clamp(36px, 10vw, 52px); }
      .description { margin-top: 18px; }
      .actions { margin-top: 28px; }
      .art { order: -1; min-height: 260px; width: min(100%, 430px); margin: 0 auto; }
      .art img { width: 112%; }
    }

    @media (max-width: 480px) {
      .actions { display: grid; }
      .button { width: 100%; }
      .art { min-height: 220px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./krane-b2c.html" aria-label="Krane Clinic — กลับหน้าหลัก">
      <img src="./assets/krane-clinic-lockup-v1.svg" alt="Krane Clinic">
    </a>
  </header>

  <main>
    <section class="not-found" aria-labelledby="not-found-title">
      <div class="copy">
        <p class="eyebrow">404 · ไม่พบหน้านี้</p>
        <h1 id="not-found-title">ดูเหมือนหน้านี้จะหลงทาง</h1>
        <p class="description">ลิงก์นี้อาจถูกย้าย เปลี่ยนชื่อ หรือไม่มีอยู่แล้ว คุณสามารถกลับไปหน้าหลัก หรือเริ่มปรึกษาแพทย์กับเราได้เลย</p>

        <div class="actions">
          <a class="button button--primary" href="./krane-b2c.html">
            กลับหน้าหลัก
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <a class="button button--secondary" href="./b2c/krane-b2c.html?entry=direct&amp;fresh=1#conditions">เริ่มปรึกษาแพทย์</a>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <img src="./b2c/assets/state-editorial-v5-ink/empty-activities.png" alt="">
      </div>
    </section>
  </main>
</body>
</html>
