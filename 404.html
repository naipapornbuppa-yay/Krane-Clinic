<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f7f9fb">
  <title>ไม่พบหน้านี้ | Krane Clinic</title>
  <link rel="stylesheet" href="/Krane-Clinic/b2c/fonts.css">
  <link rel="stylesheet" href="/Krane-Clinic/b2c/design-tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html { background: #f7f9fb; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      color: #121824;
      background:
        radial-gradient(circle at 10% 10%, rgba(198, 204, 220, .2), transparent 30rem),
        #f7f9fb;
      font-family: var(--font-base, "Noto Sans Thai", sans-serif);
    }

    a { color: inherit; }

    .site-header {
      width: min(1180px, calc(100% - 48px));
      height: 104px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 168px;
      height: auto;
    }

    main {
      width: min(1180px, calc(100% - 48px));
      min-height: calc(100vh - 104px);
      min-height: calc(100svh - 104px);
      margin: 0 auto;
      padding: 32px 0 72px;
      display: grid;
      place-items: center;
    }

    .not-found {
      position: relative;
      width: 100%;
      min-height: 526px;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, .93fr) minmax(380px, 1.07fr);
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding: clamp(48px, 7vw, 96px);
      border: 1px solid #e4e7ec;
      border-radius: 48px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(18, 24, 36, .08);
      isolation: isolate;
    }

    .not-found::before {
      content: "404";
      position: absolute;
      top: -70px;
      right: 18px;
      z-index: -1;
      color: #f1f3f7;
      font-family: var(--font-display, "Prompt", sans-serif);
      font-size: clamp(180px, 24vw, 330px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.08em;
      user-select: none;
    }

    .copy { max-width: 510px; min-width: 0; }

    .status {
      margin: 0 0 14px;
      color: #40599b;
      font: 600 13px/1.4 system-ui, sans-serif;
      letter-spacing: .15em;
    }

    .actions { margin-top: 28px; }

    .home-link, .locale-toggle {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font: 500 15px/1.4 "Prompt", "Noto Sans Thai", sans-serif;
    }

    .home-link {
      gap: 8px;
      padding: 10px 20px;
      background: #40599b;
      color: #fff;
      text-decoration: none;
    }
    .home-link:hover { background: #314781; }
    .home-link svg { flex: none; }

    .locale-toggle {
      min-width: 48px;
      padding: 8px 12px;
      border: 1px solid #c8d1e4;
      background: #fff;
      color: #304678;
      cursor: pointer;
    }
    .locale-toggle[hidden] { display: none; }
    :is(a, button):focus-visible { outline: 3px solid #314781; outline-offset: 4px; }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-family: var(--font-display, "Prompt", sans-serif);
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.03em;
    }

    .description {
      max-width: 40ch;
      margin: 24px 0 0;
      color: #667085;
      font-family: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
      font-size: clamp(16px, 1.5vw, 18px);
      line-height: 1.75;
    }

    .art {
      position: relative;
      min-height: 390px;
      display: grid;
      place-items: center;
      border-radius: 50% 44% 48% 42%;
      background: #eef0f7;
      transform: rotate(-2deg);
    }

    .art img {
      position: relative;
      z-index: 1;
      width: min(112%, 610px);
      max-width: none;
      height: auto;
      transform: rotate(2deg) translateY(12px);
      filter: drop-shadow(0 18px 18px rgba(18, 24, 36, .08));
    }

    @media (max-width: 820px) {
      .site-header { width: min(100% - 32px, 680px); height: 82px; }
      .brand img { width: 146px; }

      main {
        width: min(100% - 32px, 680px);
        min-height: calc(100svh - 82px);
        padding: 12px 0 32px;
      }

      .not-found {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 28px;
        padding: 44px 28px 34px;
        border-radius: 32px;
      }

      .not-found::before { top: -28px; right: 2px; font-size: 180px; }
      h1 { max-width: 15ch; font-size: clamp(34px, 9.5vw, 50px); }
      .description { margin-top: 18px; }
      .actions { margin-top: 28px; }
      .art { min-height: 240px; width: min(100%, 430px); margin: 0 auto; }
      .art img { width: 112%; }
    }

    @media (max-width: 480px) {
      .not-found { padding: 34px 22px 28px; }
      .art { min-height: 176px; }
    }
  </style>
<link rel="icon" type="image/svg+xml" href="/Krane-Clinic/assets/brand-final/krane-favicon.svg">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/Krane-Clinic/b2c/krane-b2c-landing.html" aria-label="Krane Clinic — กลับหน้าหลัก">
      <img src="/Krane-Clinic/assets/brand-final/krane-lockup.svg" alt="Krane Clinic">
    </a>
    <button class="locale-toggle" type="button" lang="en" aria-label="Switch to English" hidden>EN</button>
  </header>

  <main>
    <section class="not-found" aria-labelledby="not-found-title">
      <div class="copy">
        <p class="status">404</p>
        <h1 id="not-found-title">ดูเหมือนหน้านี้จะหลงทาง</h1>
        <p class="description">ลิงก์นี้อาจเปลี่ยนไป หรือหน้านี้อาจไม่มีแล้ว กลับไปหน้าหลักเพื่อเลือกโปรแกรมหรืออ่านบทความสุขภาพได้เลย</p>
        <div class="actions">
          <a class="home-link" href="/Krane-Clinic/b2c/krane-b2c-landing.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            <span>กลับหน้าหลัก</span>
          </a>
        </div>
      </div>

      <div class="art" aria-hidden="true">
        <img src="/Krane-Clinic/b2c/assets/state-editorial-v5-ink/empty-activities.png" alt="">
      </div>
    </section>
  </main>
  <script>
    (() => {
      const button = document.querySelector('.locale-toggle');
      const brand = document.querySelector('.brand');
      const heading = document.getElementById('not-found-title');
      const description = document.querySelector('.description');
      const link = document.querySelector('.home-link');
      const copy = {
        th: ['ไม่พบหน้านี้', heading.textContent, description.textContent, 'กลับหน้าหลัก', 'EN', 'Switch to English'],
        en: ['Page not found', 'This page seems to have wandered off', 'This link may have changed, or the page may no longer exist. Head back to the homepage to explore our programmes or read health articles.', 'Back to homepage', 'ไทย', 'เปลี่ยนเป็นภาษาไทย']
      };
      const apply = lang => {
        const [title, headline, intro, cta, toggle, toggleLabel] = copy[lang];
        document.documentElement.lang = lang;
        document.title = title + ' | Krane Clinic';
        heading.textContent = headline;
        description.textContent = intro;
        link.querySelector('span').textContent = cta;
        brand.setAttribute('aria-label', 'Krane Clinic — ' + cta);
        button.textContent = toggle;
        button.lang = lang === 'th' ? 'en' : 'th';
        button.setAttribute('aria-label', toggleLabel);
        const href = '/Krane-Clinic/b2c/krane-b2c-landing.html' + (lang === 'en' ? '?lang=en' : '?lang=th');
        link.href = brand.href = href;
      };
      button.addEventListener('click', () => apply(document.documentElement.lang === 'th' ? 'en' : 'th'));
      apply(new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'th');
      button.hidden = false;
    })();
  </script>
</body>
</html>
