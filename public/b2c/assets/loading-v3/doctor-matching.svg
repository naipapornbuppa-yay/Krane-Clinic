<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="หากำลังค้นหาคุณหมอ">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .soft{stroke:#9dc2ff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .ring{transform-origin:60px 60px;animation:sweep 2.4s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{0%{transform:scale(.55);opacity:0}35%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .ring2{animation-delay:1.2s}
  .bell{transform-origin:78px 74px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<circle class="s soft ring" cx="60" cy="60" r="34" stroke-width="3"/>
<circle class="s soft ring ring2" cx="60" cy="60" r="34" stroke-width="3"/>
<path class="s" d="M40 28v16a14 14 0 0 0 28 0V28"/>
<path class="s" d="M36 28h8M64 28h8"/>
<g class="bell"><path class="s" d="M54 58v6a16 16 0 0 0 24 13.8"/><circle class="s" cx="82" cy="74" r="8"/></g>
</svg>
