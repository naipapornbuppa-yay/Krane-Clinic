<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="กำลังรอเข้าห้องปรึกษา">
<style>
  .s{fill:none;stroke:#1973FF;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
  .f{fill:#1973FF}
  .dim{opacity:.32}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .sway{transform-origin:60px 58px;animation:sway 3.4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(1.5px)}}
  .dot{animation:blink 1.8s ease-in-out infinite}
  .dot:nth-of-type(2){animation-delay:.25s}.dot:nth-of-type(3){animation-delay:.5s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<g class="sway"><rect class="s" x="24" y="38" width="46" height="34" rx="8"/>
<path class="s" d="M70 52l22-12v32L70 60z"/></g>
<g class="f"><circle class="dot" cx="43" cy="92" r="4"/><circle class="dot" cx="60" cy="92" r="4"/><circle class="dot" cx="77" cy="92" r="4"/></g>
</svg>
