<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="แผงยาเม็ดแก้ไอ">
  <!-- Dextromethorphan HBr + Glyceryl Guaiacolate + Terpin Hydrate: round
       pale-yellow tablets in a foil blister, the form the plan prices as "แผง". -->
  <defs>
    <linearGradient id="cough-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset=".45" stop-color="#d9e2ee"/>
      <stop offset=".55" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#c9d5e4"/>
    </linearGradient>
    <radialGradient id="cough-tab" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#fdf3d0"/>
      <stop offset=".6" stop-color="#f5e3a8"/>
      <stop offset="1" stop-color="#e2ca7f"/>
    </radialGradient>
    <filter id="cough-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#1b2b45" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#cough-shadow)">
    <rect x="17" y="12" width="62" height="72" rx="9" fill="url(#cough-foil)" stroke="#b3c1d4" stroke-width="1.2"/>
    <path d="M17 24h62" stroke="#b3c1d4" stroke-width=".9" stroke-dasharray="3 3" opacity=".7"/>
    <path d="M48 12v72" stroke="#b3c1d4" stroke-width=".9" stroke-dasharray="3 3" opacity=".55"/>
    <g>
      <circle cx="33" cy="38" r="10.5" fill="url(#cough-tab)" stroke="#cdb26a" stroke-width=".9"/>
      <circle cx="63" cy="38" r="10.5" fill="url(#cough-tab)" stroke="#cdb26a" stroke-width=".9"/>
      <circle cx="33" cy="65" r="10.5" fill="url(#cough-tab)" stroke="#cdb26a" stroke-width=".9"/>
      <circle cx="63" cy="65" r="10.5" fill="url(#cough-tab)" stroke="#cdb26a" stroke-width=".9"/>
    </g>
    <g fill="#fff" opacity=".55">
      <ellipse cx="29.5" cy="34" rx="3.4" ry="2.1" transform="rotate(-28 29.5 34)"/>
      <ellipse cx="59.5" cy="34" rx="3.4" ry="2.1" transform="rotate(-28 59.5 34)"/>
      <ellipse cx="29.5" cy="61" rx="3.4" ry="2.1" transform="rotate(-28 29.5 61)"/>
      <ellipse cx="59.5" cy="61" rx="3.4" ry="2.1" transform="rotate(-28 59.5 61)"/>
    </g>
  </g>
</svg>
