<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="แผงยานาพรอกเซน">
  <!-- Naproxen 250 mg: peach-toned round tablets, the colour the tablet is
       usually coated in, so it reads apart from the white ones in the list. -->
  <defs>
    <linearGradient id="nap-foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset=".45" stop-color="#dde6f0"/>
      <stop offset=".55" stop-color="#f1f5fa"/>
      <stop offset="1" stop-color="#ccd8e6"/>
    </linearGradient>
    <radialGradient id="nap-tab" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffd9c2"/>
      <stop offset=".6" stop-color="#f8bd9c"/>
      <stop offset="1" stop-color="#e09a75"/>
    </radialGradient>
    <filter id="nap-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#1b2b45" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#nap-shadow)">
    <rect x="15" y="15" width="66" height="66" rx="9" fill="url(#nap-foil)" stroke="#b6c4d6" stroke-width="1.2"/>
    <path d="M48 15v66" stroke="#b6c4d6" stroke-width=".9" stroke-dasharray="3 3" opacity=".5"/>
    <path d="M15 48h66" stroke="#b6c4d6" stroke-width=".9" stroke-dasharray="3 3" opacity=".5"/>
    <g>
      <circle cx="32" cy="32" r="11" fill="url(#nap-tab)" stroke="#cf8a63" stroke-width=".9"/>
      <circle cx="64" cy="32" r="11" fill="url(#nap-tab)" stroke="#cf8a63" stroke-width=".9"/>
      <circle cx="32" cy="64" r="11" fill="url(#nap-tab)" stroke="#cf8a63" stroke-width=".9"/>
      <circle cx="64" cy="64" r="11" fill="url(#nap-tab)" stroke="#cf8a63" stroke-width=".9"/>
    </g>
    <g stroke="#d99873" stroke-width="1.1" stroke-linecap="round" opacity=".85">
      <path d="M32 26.5v11M64 26.5v11M32 58.5v11M64 58.5v11"/>
    </g>
    <g fill="#fff" opacity=".5">
      <ellipse cx="28" cy="28" rx="3.5" ry="2.2" transform="rotate(-28 28 28)"/>
      <ellipse cx="60" cy="28" rx="3.5" ry="2.2" transform="rotate(-28 60 28)"/>
      <ellipse cx="28" cy="60" rx="3.5" ry="2.2" transform="rotate(-28 28 60)"/>
      <ellipse cx="60" cy="60" rx="3.5" ry="2.2" transform="rotate(-28 60 60)"/>
    </g>
  </g>
</svg>
