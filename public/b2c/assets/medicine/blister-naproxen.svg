<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="แผงยานาพรอกเซน">
  <defs>
    <linearGradient id="naproxen-foil" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0" stop-color="#fdfefe"/><stop offset=".22" stop-color="#dfe7ef"/>
      <stop offset=".40" stop-color="#f6f9fc"/><stop offset=".58" stop-color="#cfdae6"/>
      <stop offset=".78" stop-color="#eef3f8"/><stop offset="1" stop-color="#c2cfdd"/>
    </linearGradient>
    <radialGradient id="naproxen-dome" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#e9eff6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#a8b8ca" stop-opacity=".55"/>
