<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="แผงยาพาราเซตามอล">
  <defs>
    <linearGradient id="paracetamol-foil" x1=".05" y1="0" x2=".95" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".14" stop-color="#e4ebf2"/>
      <stop offset=".30" stop-color="#fbfdfe"/><stop offset=".46" stop-color="#ccd8e5"/>
      <stop offset=".62" stop-color="#f4f8fb"/><stop offset=".80" stop-color="#d3dee9"/>
      <stop offset="1" stop-color="#b6c4d4"/>
    </linearGradient>
    <linearGradient id="paracetamol-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dadc0"/><stop offset="1" stop-color="#7c8ea4"/>
    </linearGradient>
    <radialGradient id="paracetamol-dome" cx=".33" cy=".26" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".5" stop-color="#eef4f9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9fb1c5" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="paracetamol-tab" cx=".34" cy=".27" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f5f8fb"/><stop offset="1" stop-color="#d7e0ea"/></radialGradient>
    <radialGradient id="paracetamol-tabao" cx=".5" cy=".5" r=".5">
      <stop offset=".62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#6f7d8d" stop-opacity=".40"/>
    </radialGradient>
    <filter id="paracetamol-brush" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .92" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <filter id="paracetamol-ao" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="paracetamol-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="paracetamol-cast" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.4" flood-color="#16243a" flood-opacity=".34"/>
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#16243a" flood-opacity=".20"/>
    </filter>
  </defs>
