<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Paper crane flying" shape-rendering="geometricPrecision">
  <style>
    .outline{stroke:#173963;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .pencil{fill:none;stroke:#6e86a5;stroke-width:.7;stroke-linecap:round;stroke-linejoin:round;opacity:.5;vector-effect:non-scaling-stroke}
    .detail{fill:none;stroke:#6e86a5;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82;vector-effect:non-scaling-stroke}
    .motion{fill:none;stroke:#8da1ba;stroke-width:1;stroke-linecap:round;opacity:.48;vector-effect:non-scaling-stroke}
    .paper{fill:#fcf7ef}.blue{fill:#d7e4f3}.sage{fill:#dce4d8}
  </style>

  <!-- Four rigid drawings switch discretely, like a hand-drawn frame animation.
       Only the complete illustration drifts gently; no path morphing or blur. -->
  <g transform="translate(280 174)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="-7 3;0 -5;7 1;0 5;-7 3" keyTimes="0;.25;.5;.75;1"
      dur="1.65s" repeatCount="indefinite"/>

    <g class="wing-frame wing-frame--up">
      <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.249;.25;.999;1" calcMode="discrete" dur="1.65s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-7 4-158-91-55 47Z"/>
      <path class="pencil" d="M-9 3-154-88-54 44Z"/>
      <path class="detail" d="M-15 3-118-67M-91-50l17 8M-106-62l15 8"/>
      <path class="blue outline" d="M8 4 160-104 57 47Z"/>
      <path class="pencil" d="M10 4 156-100 56 44Z"/>
      <path class="detail" d="M17 3 122-76M37 20 88-36M106-64l18-13M92-51l17-12"/>
    </g>

    <g class="wing-frame wing-frame--middle-a">
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.249;.25;.499;.5" calcMode="discrete" dur="1.65s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-7 4-169-37-55 47Z"/>
      <path class="pencil" d="M-9 3-165-35-54 44Z"/>
      <path class="detail" d="M-16 3-126-27M-96-22l18 5M-113-29l16 5"/>
      <path class="blue outline" d="M8 4 169-47 57 47Z"/>
      <path class="pencil" d="M10 4 165-45 56 44Z"/>
      <path class="detail" d="M18 4 127-35M40 21 94-17M116-30l19-6M100-22l18-6"/>
    </g>

    <g class="wing-frame wing-frame--down">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.499;.5;.749;.75" calcMode="discrete" dur="1.65s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-7 4-146 54-55 47Z"/>
      <path class="pencil" d="M-9 3-142 52-54 44Z"/>
      <path class="detail" d="M-16 5-111 42M-85 34l17-4M-100 40l15-4"/>
      <path class="blue outline" d="M8 4 148 61 57 47Z"/>
      <path class="pencil" d="M10 4 144 58 56 44Z"/>
      <path class="detail" d="M18 5 112 47M42 22 84 45M100 50l18 7M87 45l17 7"/>
    </g>

    <g class="wing-frame wing-frame--middle-b">
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.749;.75;.999;1" calcMode="discrete" dur="1.65s" repeatCount="indefinite"/>
      <path class="paper outline" d="M-7 4-166-45-55 47Z"/>
      <path class="pencil" d="M-9 3-162-43-54 44Z"/>
      <path class="detail" d="M-16 3-123-32M-94-25l18 5M-110-33l16 5"/>
      <path class="blue outline" d="M8 4 166-39 57 47Z"/>
      <path class="pencil" d="M10 4 162-37 56 44Z"/>
      <path class="detail" d="M18 4 124-29M40 21 92-13M113-25l19-5M98-18l18-5"/>
    </g>

    <path class="paper outline" d="M-50 31-67-48-109-77-96-91-53-63-18-29 2-20Z"/>
    <path class="pencil" d="M-48 29-65-46-106-76-96-88-54-61-19-27"/>
    <path class="blue outline" d="M-109-77-96-91-87-70Z"/>
    <path class="detail" d="M-66-45-51-58M-70-59l10 6"/>

    <path class="paper outline" d="M48 27 144 3 58 57Z"/>
    <path class="pencil" d="M50 28 140 5 59 54Z"/>

    <path class="sage outline" d="M0-25 61 32 2 92-62 35Z"/>
    <path class="pencil" d="M1-23 59 32 2 89-60 35Z"/>
    <path class="detail" d="M0-20 33 12M-19 45l13 11M-12 38 1 50"/>

    <path class="motion" d="M129 74h34M143 61h27M137 87h22">
      <animate attributeName="opacity" values=".2;.65;.2" dur="1.65s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
