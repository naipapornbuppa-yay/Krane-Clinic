<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-label="Paper folding into an origami crane">
  <style>
    .outline{stroke:#173963;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .detail{fill:none;stroke:#54739a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .crease{fill:none;stroke:#54739a;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:9 10;vector-effect:non-scaling-stroke}
    .paper{fill:#fbf4ee}.blue{fill:#bfd3ec}.sage{fill:#d7e2d1}
  </style>

  <!-- Each stage changes only while the paper is edge-on. No path morphing,
       blur, filter, or opacity tween is used, so every visible line stays crisp. -->
  <g transform="translate(280 177)">
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.299;.3;.999;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 1;1 1;1 .05;1 .05" keyTimes="0;.08;.18;.3;1" dur="5.2s" repeatCount="indefinite"/>
      <path class="paper outline" d="M0-112 112 0 0 112-112 0Z"/>
      <path class="crease" d="M0-108V108M-108 0H108"/>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.299;.3;.519;.52;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 .05;1 1;1 .05;1 .05" keyTimes="0;.3;.42;.52;1" dur="5.2s" repeatCount="indefinite"/>
      <path class="blue outline" d="M0-88 101 0 0 88-101 0Z" transform="translate(0 12)"/>
      <path class="paper outline" d="M0-94 106 0 0 94-106 0Z"/>
      <path class="sage outline" d="M-106 0 0 94 106 0 0 32Z"/>
      <path class="detail" d="M0-89V89"/>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.519;.52;.999;1" calcMode="discrete" dur="5.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 .05;1 .05;1 1;1 1;1 .05" keyTimes="0;.52;.6;.96;1" dur="5.2s" repeatCount="indefinite"/>

      <g transform="translate(-10 -16)">
        <g>
          <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.58;.78;1" dur="5.2s" repeatCount="indefinite"/>
          <path class="paper outline" d="M0 0-145-68-48 51Z"/>
          <path class="detail" d="M-6 3-105-49"/>
        </g>
      </g>

      <g transform="translate(10 -16)">
        <g>
          <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.62;.82;1" dur="5.2s" repeatCount="indefinite"/>
          <path class="blue outline" d="M0 0 145-92 52 51Z"/>
          <path class="detail" d="M13 2 107-67M30 17 77-29"/>
        </g>
      </g>

      <g transform="translate(-55 34)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 .035;1 .035;1 1;1 1" keyTimes="0;.58;.8;1" dur="5.2s" repeatCount="indefinite"/>
          <path class="paper outline" d="M0 0-14-82-54-112-39-122 4-87 46-49Z"/>
          <path class="blue outline" d="M-54-112-39-122-30-102Z"/>
          <path class="detail" d="M-13-78 4-87"/>
        </g>
      </g>

      <g transform="translate(55 34)">
        <g>
          <animateTransform attributeName="transform" type="scale" values=".035 1;.035 1;1 1;1 1" keyTimes="0;.66;.84;1" dur="5.2s" repeatCount="indefinite"/>
          <path class="paper outline" d="M0 0 98-24 9 32Z"/>
        </g>
      </g>

      <path class="sage outline" d="M0-25 62 34 0 94-62 34Z"/>
      <path class="detail" d="M0-20 33 12"/>
    </g>
  </g>
</svg>
