<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9dcde">
  <title>Krane Clinic · Client review</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;margin:0;background:#d9dcde}
    body{position:relative;isolation:isolate;min-height:100%;min-height:100dvh;margin:0;display:grid;place-items:center;overflow:hidden;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));color:#18191b;font-family:"Prompt","Noto Sans Thai",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body::before{content:"";position:fixed;z-index:-2;inset:-20px;background:url("/Krane-Clinic/b2c/assets/landing-573/latest/hero-base.png?v=20260729k") 34% center/cover no-repeat;filter:grayscale(1) blur(5px);opacity:.22;transform:scale(1.04)}
    body::after{content:"";position:fixed;z-index:-1;inset:0;background:linear-gradient(145deg,rgba(245,244,241,.92),rgba(216,220,222,.94) 54%,rgba(190,196,200,.96))}
    main{width:min(100%,650px);padding:52px 54px 48px;border:1px solid rgba(255,255,255,.84);border-radius:34px;background:rgba(248,247,244,.88);box-shadow:0 28px 76px rgba(24,25,27,.16),inset 0 1px 0 rgba(255,255,255,.95);text-align:center;backdrop-filter:blur(22px) saturate(.75);-webkit-backdrop-filter:blur(22px) saturate(.75);animation:card-in .45s cubic-bezier(.22,1,.36,1) both}
    .review-logo{display:block;width:178px;height:auto;margin:0 auto 26px}
    h1{margin:0;color:#18191b;font-size:clamp(38px,4vw,48px);font-weight:650;line-height:1.18;letter-spacing:-.025em}
    .subtitle{margin:16px 0 0;color:#666a70;font-size:17px;font-weight:400;line-height:1.55}
    form{width:min(100%,430px);margin:30px auto 0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .access-field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:56px;padding:4px;border:1.5px solid rgba(67,70,75,.42);border-radius:999px;background:rgba(255,255,255,.58);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transition:border-color .18s ease,background .18s ease,box-shadow .18s ease}
    .access-field:focus-within{border-color:#25272b;background:#fff;box-shadow:0 0 0 4px rgba(37,39,43,.1)}
    input{min-width:0;width:100%;height:46px;padding:0 16px;border:0;outline:0;background:transparent;color:#18191b;text-align:center;font:500 16px/1 "Prompt","Noto Sans Thai",ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}
    input::placeholder{color:#7d8187;opacity:1;letter-spacing:.04em}
    button{display:grid;place-items:center;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:#25272b;color:#fff;font:400 25px/1 ui-sans-serif,system-ui,sans-serif;cursor:pointer;box-shadow:0 7px 18px rgba(24,25,27,.18);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
    button:hover{transform:translateX(2px);background:#0f1012;box-shadow:0 9px 22px rgba(24,25,27,.22)}
    button:active{transform:translateX(2px) scale(.96)}
    .error{min-height:20px;margin:14px 0 -8px;color:#8a332f;font-size:13px;font-weight:600;line-height:1.45;visibility:hidden}
    .error.is-visible{visibility:visible;display:inline-block;padding:8px 12px;border:1px solid #e3c6c3;border-radius:999px;background:#f8ecea}
    @keyframes card-in{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
    @media(max-width:560px){body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}body::before{background-position:28% center}main{padding:40px 22px 32px;border-radius:28px}.review-logo{width:146px;margin-bottom:21px}h1{font-size:34px}.subtitle{margin-top:13px;font-size:15px;line-height:1.55}form{margin-top:24px}.access-field{min-height:54px;padding:4px}input{height:44px;padding:0 12px;font-size:15px}button{width:44px;height:44px;font-size:24px}.error{margin-top:12px}}
    @media(prefers-reduced-motion:reduce){main{animation:none}.access-field,button{transition:none}}
  </style>
</head>
<body>
  <main>
    <img class="review-logo" src="/Krane-Clinic/assets/krane-review-wordmark.svg" alt="Krane">
    <h1>ตัวอย่างงานออกแบบ</h1>
    <p class="subtitle">Design preview · ใส่รหัสแล้วเลือกส่วนที่ต้องการดู</p>
    <p class="error" id="access-message" role="alert">&nbsp;</p>
    <form id="access-form">
      <label class="sr-only" for="review-password">Access code</label>
      <div class="access-field">
        <input id="review-password" name="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" placeholder="Access code" aria-describedby="access-message" required autofocus>
        <button type="submit" aria-label="เปิดตัวอย่างงาน"><span aria-hidden="true">→</span></button>
      </div>
    </form>
  </main>
  <script>
    (() => {
      const key = "krane-client-review-access";
      const base = "/Krane-Clinic/";
      const params = new URLSearchParams(location.search);
      const requested = params.get("next");
      const safeNext = requested && requested.startsWith(base) ? requested : base + "START-HERE.html";
      if (sessionStorage.getItem(key) === "234") location.replace(safeNext);
      const form = document.getElementById("access-form");
      const input = document.getElementById("review-password");
      const error = document.getElementById("access-message");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (input.value.trim() !== "234") {
          error.textContent = "รหัสไม่ถูกต้อง กรุณาลองอีกครั้ง";
          error.classList.add("is-visible");
          input.select();
          return;
        }
        sessionStorage.setItem(key, "234");
        location.replace(safeNext);
      });
    })();
  </script>
</body>
</html>
